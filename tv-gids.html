$("#zoom").addEventListener("click", e => {
  const b = e.target.closest("[data-zoom]"); if (!b) return;
  const tl = $("#tl"), mid = T0 + (tl.scrollLeft + (tl.clientWidth - CHW) / 2) / PPM;
  PPM = +b.dataset.zoom; store.set("tvg-zoom", PPM); renderTimeline();
  tl.scrollLeft = Math.max(0, (mid - T0) * PPM - (tl.clientWidth - CHW) / 2);
});
const xOf = m => CHW + (m-T0)*PPM;
function renderTimeline(){
  const ps = ALL.filter(p => p.di === di);
  T0 = Math.min(300, ...ps.map(p => p.start)); T0 = Math.floor(T0/60)*60;
  T1 = Math.max(1500, ...ps.map(p => p.end)); T1 = Math.min(Math.ceil(T1/60)*60, 1800);
  const W = CHW + (T1-T0)*PPM, q = $("#q").value.trim().toLowerCase();
  document.querySelectorAll("[data-zoom]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.zoom === PPM));
  const isToday = DATA.days[di].date === brussels().date;
  let ruler = `<div class="ruler" style="width:${W}px"><div class="corner">${isToday ? "Vandaag" : esc(DATA.days[di].label.split(" ").slice(0,2).join(" "))}</div>`;
  const step = PPM < 3 ? 60 : 30;
  for (let m = T0; m < T1; m += step) ruler += `<span class="${m % 60 === 0 ? "hour" : ""}" style="left:${xOf(m)}px">${fmt(m)}</span>`;
  ruler += `</div>`;
  const rows = visibleCh().map(c => `<div class="row" style="width:${W}px"><div class="chcol"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</div>${
    progsOf(di,c.id).map(p => {
      const s = Math.max(p.start,T0), e = Math.min(p.end,T1); if (e <= s) return "";
      const w = Math.max((e-s)*PPM-3, 6);
      const live = nowMin !== null && p.start <= nowMin && nowMin < p.end, past = nowMin !== null && p.end <= nowMin;
      const hit = q && p.title.toLowerCase().includes(q);
      const cls = `prog${live?" live":""}${past?" past":""}${hit?" hit":""}${w < 70 ? " tiny" : ""}`;
      return `<button class="${cls}" data-p="${p.id}" style="left:${xOf(s)+1}px;width:${w}px;--cat:${catVar(p.cat)}" title="${fmt(p.start)}–${fmt(p.end)} ${esc(p.title)}"><span>${fmt(p.start)}–${fmt(p.end)}${live ? ` · nog ${p.end-nowMin} min` : ""}</span><b>${esc(p.title)}</b></button>`;
    }).join("")}</div>`).join("");
  const line = nowMin !== null && nowMin >= T0 && nowMin <= T1 ? `<div class="nowline" style="left:${xOf(nowMin)}px" data-t="${fmt(nowMin)}"></div>` : "";
  $("#tlinner").style.width = W+"px";
  $("#tlinner").innerHTML = ruler + rows + line;
  $("#legend").innerHTML = Object.entries(CATS).map(([k,v]) => `<span style="--cat:var(--c-${k})">${v}</span>`).join("");
}
const jumpTo = m => $("#tl").scrollTo({left:Math.max(0,xOf(m)-CHW-40), behavior:"smooth"});
document.querySelector(".tl-tools").addEventListener("click", e => {
  const b = e.target.closest("[data-jump]"); if (!b) return;
  jumpTo(b.dataset.jump === "now" ? (nowMin ?? 1200) : +b.dataset.jump);
});

const PARTS = [["ochtend","Ochtend",300,720],["middag","Middag",720,1080],["avond","Avond",1080,1440],["nacht","Nacht",1440,1800],["alles","Hele dag",0,1800]];
let part = (t => t < 720 ? "ochtend" : t < 1080 ? "middag" : t < 1440 ? "avond" : "nacht")(nowMin ?? 1200);
function itemHTML(p, wide){
  const live = p.di === di && nowMin !== null && p.start <= nowMin && nowMin < p.end, c = chById[p.ch];
  const dayTag = wide && p.di !== di ? `<small>${esc(DATA.days[p.di].label.split(" ").slice(0,2).join(" "))}</small>` : "";
  return `<li class="item${wide?" wide":""}${live?" live":""}" style="--cat:${catVar(p.cat)}">
    <span class="t">${fmt(p.start)}${dayTag}</span>
    ${wide ? `<span class="chn"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>` : ""}
    <span class="namewrap"><button class="name" data-p="${p.id}">${esc(p.title)}</button><span class="cat">${CATS[p.cat]||CATS.o} · ${dur(p)}</span></span>
    <button class="star" data-star="${p.id}" aria-pressed="${stars.has(p.id)}" aria-label="Mijn lijst">★</button></li>`;
}
function renderCols(){
  $("#parts").innerHTML = PARTS.map(([k,l]) => `<button class="pill" data-part="${k}" aria-pressed="${k===part}">${l}</button>`).join("");
  const [, , a, b] = PARTS.find(x => x[0] === part);
  $("#cols").innerHTML = visibleCh().map(c => {
    const ps = progsOf(di,c.id).filter(p => p.end > a && p.start < b);
    return `<div class="col"><h3><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</h3>${ps.length ? `<ul>${ps.map(p => itemHTML(p,false)).join("")}</ul>` : `<p class="empty">Geen uitzendingen in dit dagdeel.</p>`}</div>`;
  }).join("");
}
$("#parts").addEventListener("click", e => { const b = e.target.closest("[data-part]"); if (b){ part = b.dataset.part; renderCols(); } });

function renderStars(){
  const list = [...stars].map(id => byId[id]).filter(Boolean).sort((a,b) => a.di-b.di || a.start-b.start);
  $("#starcount").textContent = list.length ? `(${list.length})` : "";
  $("#starcols").innerHTML = `<div class="col" style="grid-column:1/-1">${list.length ? `<ul>${list.map(p => itemHTML(p,true)).join("")}</ul>` : `<p class="empty">Tik op ★ naast een programma om het hier te bewaren.</p>`}</div>`;
}
function renderResults(){
  const raw = $("#q").value.trim(), q = raw.toLowerCase(), box = $("#results");
  if (q.length < 2){ box.hidden = true; return; }
  const hits = ALL.filter(p => !hidden.has(p.ch) && p.title.toLowerCase().includes(q)).sort((a,b) => a.di-b.di || a.start-b.start);
  box.hidden = false;
  box.innerHTML = `<h2>${hits.length ? `${hits.length} uitzending${hits.length>1?"en":""} voor “${esc(raw)}”` : `Niets gevonden voor “${esc(raw)}”. Probeer een kortere zoekterm.`}</h2>${hits.length ? `<ul>${hits.map(p => itemHTML(p,true)).join("")}</ul>` : ""}`;
}
$("#q").addEventListener("input", () => { renderResults(); if (view === "tijdlijn") renderTimeline(); });

let openId = null;
function openDetail(id){
  const p = byId[id]; if (!p) return; openId = id; const c = chById[p.ch], n = nowFor(p.di);
  $("#d-ch").innerHTML = `<span class="dot" style="background:${c.color}"></span>${esc(c.name)} · ${esc(DATA.days[p.di].label)}`;
  $("#d-title").textContent = p.title;
  let rel = "";
  if (n !== null){
    if (p.start <= n && n < p.end) rel = ` · nu bezig, nog ${p.end-n} min`;
    else if (p.start > n){ const d = p.start-n; rel = d < 60 ? ` · begint over ${d} min` : ` · begint over ${Math.floor(d/60)} u ${d%60} min`; }
  }
  $("#d-time").textContent = `${fmt(p.start)}–${fmt(p.end)} (${dur(p)})${rel}`;
  $("#d-cat").textContent = CATS[p.cat] || CATS.o;
  $("#d-desc").textContent = p.desc; $("#d-desc").hidden = !p.desc;
  $("#d-link").href = c.link;
  $("#d-star").textContent = stars.has(id) ? "Verwijder van mijn lijst" : "Zet op mijn lijst";
  $("#scrim").hidden = false; $("#d-close").focus();
}
const closeDetail = () => { $("#scrim").hidden = true; openId = null; };
$("#d-close").addEventListener("click", closeDetail);
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
$("#d-star").addEventListener("click", () => { toggleStar(openId); $("#d-star").textContent = stars.has(openId) ? "Verwijder van mijn lijst" : "Zet op mijn lijst"; });
function toggleStar(id){ stars.has(id) ? stars.delete(id) : stars.add(id); store.set("tvg-stars",[...stars]); renderCols(); renderStars(); renderResults(); }
document.addEventListener("click", e => {
  const s = e.target.closest("[data-star]"); if (s){ toggleStar(s.dataset.star); return; }
  const p = e.target.closest("[data-p]"); if (p) openDetail(p.dataset.p);
});

const VIEWS = ["nu","tijdlijn","zenders","lijst"];
function setView(v){
  if (!VIEWS.includes(v)) v = "tijdlijn"; view = v;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  VIEWS.forEach(x => $("#v-"+x).hidden = x !== v);
  if (v === "tijdlijn"){ renderTimeline(); requestAnimationFrame(() => jumpTo(nowMin ?? 1200)); }
}
document.querySelector(".tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t){ location.hash = t.dataset.view; setView(t.dataset.view); } });
window.addEventListener("hashchange", () => setView(location.hash.slice(1)));
function renderAll(){ renderHeader(); renderChips(); renderBoard(); renderCols(); renderStars(); renderResults(); if (view === "tijdlijn") renderTimeline(); }
renderAll(); setView(location.hash.slice(1) || "tijdlijn");
setInterval(() => {
  const live = atMin === nowMin; nowMin = nowFor(di);
  if (live && nowMin !== null) atMin = nowMin;
  renderHeader(); renderBoard(); if (view === "tijdlijn") renderTimeline();
}, 30000);
</script>
</body>
</html>

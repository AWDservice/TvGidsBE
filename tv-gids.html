waarin de presentatoren een afspraak hebben met gasten uit het nieuws."], [2725, 2775, "Leven van de Colorado", "o", "VRT NWS-journalist Bert De Vroey volgt de iconische Colorado-rivier van de Rocky Mountains tot aan de Mexicaanse grens. De rivier is de belangrijkste waterbron voor 40 miljoen mensen in het Amerikaanse Westen."], [2775, 2805, "Clinch", "o", "Een rijinstructeur is apetrots. Voor een reportage wordt hij een dag gevolgd door een filmstudent."], [2805, 2835, "Clinch", "o", "Drie mannen zitten vast in een lift. Er is echter geen reden tot paniek. Kees brengt redding."], [2835, 2840, "Het weer", "n", "Dagelijks programma waarin de weersvoorspelling wordt gepresenteerd."], [2840, 2905, "De popcast", "o", "Stijn Van de Voorde laat in deze podcast samen met Otto-Jan Ham, Kirsten Lemaire, Thibault Christiaensen en Lennert Coorevits zijn licht schijnen over het popnieuws van de afgelopen week."], [2905, 2965, "Nachtlus", "o", "Doorlopende herhaling tot de start van de ochtenduitzendingen."]], "ketnet": [[360, 365, "Tik Tak", "k", "Er is een Inuit-disco en een magisch behang met kwallen erop. Boekenjongen maakt een achtbaan."], [365, 370, "Bumba", "k", "Bumba, Arro, Poppa en Bumbalu eten samen bananen in de ruimte. Arro leert het woord 'raket'."], [370, 375, "Timbalo", "k", "Is het nu Pepe, Zaza of Toto in de tuin? Mimi tekent een beer, meetellen met dieren, samen spelen in het zwembad in de tuin en erna smullen van een taart."], [375, 380, "Ellie de olifant", "k", "Ellie de Olifant en haar vriendjes zijn aan het luieren op een mooie, warme dag. Ineens gooit Kikker een waterballon. De anderen gaan ook allemaal waterballonnen gooien. Ze hebben veel pret. Walvis is verdrietig, omdat hij te groot is om mee te doen."], [380, 385, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [385, 390, "Simon", "k", "Morgen gaan Simon en zijn klas voor het eerst zwemmen. Daar heeft hij echt geen zin in! Lou is ook bang en Simon troost haar en spoort haar aan het toch te proberen."], [390, 395, "Kaatjes Kameraadjes", "k", "Kaatje en Kamiel verzorgen een ziek plantje met veel liefde, maar plantje wordt, maar niet beter. Ze doen een beroep op hun kameraadje Finn die alles weet over het verzorgen van planten en bomen."], [395, 405, "Dropje", "k", "Dropje haalt `de kriebel' uit de trui van een buurmeisje. Het is fijn dat het nu niet meer kriebelt, maar het is wel een beetje koud."], [405, 410, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [410, 415, "Bing", "k", "Bing en Flop spelen verstoppertje terwijl ze op weg zijn naar Padget's winkel. Eenmaal in de winkel, wil Bing niet dat het spelletje ophoudt, dus verstopt hij zich achter de deur van de voorraadkast."], [415, 420, "Toet Toet Cory Carson", "k", "Cory krijgt een lekke band terwijl hij bumperbal oefent met zijn vrienden. Iedereen maakt zich zorgen, omdat de grote wedstrijd al over een paar uur van start gaat. Dokter Wisserbril probeert hem te repareren."], [420, 430, "Mojo Wisseltop", "k", "Voor de nieuwe salade van kok Fabio plukken Mojo en Bo speciale blaadjes op Toppenberg. Maar een hongerige berggeit wil ze ook, en geeft niet zomaar op."], [430, 435, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [435, 445, "Biggen Bouwers", "k", "Fred en Dana vragen aan de biggen om leuke buitenactiviteiten te verzinnen voor Keith en Rebecca. Elke big bedenkt zijn eigen spel maar Cesars idee is zo groot dat hij niet weet of hij het in zijn eentje kan afmaken."], [445, 450, "Samson en Marie", "k", "Samson wil drummen. Marie knutselt voor Samson een drumstel. Wanneer het drumstel af is, is Samson niet meer te houden. Hij drumt de hele tijd. Echt, de hele tijd. Hij blijft maar gaan. Marie wordt er knettergek van."], [450, 455, "Molang", "k", "Piu Piu en Molang willen graag een uniform dragen en sluiten zich aan bij de koninklijke wacht in Buckingham Palace. Maar de twee vrienden negeren de belangrijkste regel van de koninklijke wacht, namelijk om niet te bewegen, wat er ook gebeurt."], [455, 465, "De Smurfen", "k", "Nadat hij per ongeluk een liefdeselixir heeft opgedronken, wordt Gargamel verliefd op Blaadje."], [465, 480, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [480, 505, "Draken: beschermers van Berk", "k", "Screaming Death richt zich op andere eilanden en dreigt het leefgebied van de draak te vernietigen."], [505, 515, "De 3 Musketiers", "k", "De koning wil schaken met Charlotte met behulp van gigantische schaakstukken. Ondertussen verstopt Gaston de Rustignac zich in een van de stukken, van plan de koning te ontvoeren."], [515, 525, "Grizzy & the Lemmings", "k", "Grizzly steelt de doos met nougat van de Lemmings. Terwijl de Lemmings op zoek gaan naar nieuwe nougat, komen ze in een oud boek iets tegen over Chinese medicijnen."], [525, 530, "Karrewiet met VGT", "n", "Infomagazine voor de jeugd. Getolkt in Vlaamse Gebarentaal (VGT)."], [530, 535, "Optredens in Hallo Kroket!", "k", "Bart Peeters brengt samen met Emma We zijn ermee bezig."], [535, 540, "Kleine dingen", "k", "Blauw slaapt op een van de wortels die bedoeld zijn voor de speelgoeddieren op de boerderij."], [540, 545, "Tik Tak", "k", "Een kat en een muis, een kameleon speelt met een ananas. Het Boekenmeisje maakt een zandbak."], [545, 550, "Bumba", "k", "Bumba speelt voetbal met Zinzi. Zinzi leert dan ook het woord voetbal. Zazati tovert een kangoeroe."], [550, 555, "Timbalo", "k", "Samen spelen met onze vrienden in de speeltuin en kies jij de juiste kleuren voor het huis? Pepe bouwt een sneeuwman en sleet erop los terwijl de sterren in wolken veranderen."], [555, 560, "Uki", "k", "Egel heeft een tekening gemaakt, maar het waait weg. Egel en Konijn rennen er achteraan. Ze krijgen de tekening te pakken, maar helaas is deze gescheurd. Uki heeft een oplossing en gebruikt plakband om de tekening te fixen."], [560, 565, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [565, 570, "Ollie", "k", "Als Ollie zich prikt, beslist hij om alle scherpe voorwerpen in het park van een kurk te voorzien."], [570, 575, "Flanel & Pluis", "k", "Waterdruppels vallen op de vloer. Pluis is gefascineerd door het water, maar wil niet nat worden! Hoe kunnen ze de druppels vangen en toch droog blijven?"], [575, 580, "Kaatjes Kameraadjes", "k", "Frits en Frats houden van de brandweer en wanen zich echte brandweermannen. Wanneer blijkt dat ze nog nooit van een brandweerwagen hebben gehoord, besluit Kaatje er een kameraadje bij te halen."], [580, 585, "Stoppeltje", "k", "Stoppeltje ontmoet drie tuinkabouters die ruzie maken. Ze willen allemaal een huis bouwen."], [585, 590, "Rintje", "k", "Tobias moet naar de tandarts. Hij is zo bang dat tandarts Henriette en assistent Rintje alvast even een kijkje nemen. Rintje pakt de tandenborstel voor een serieuze poetsbehandeling."], [590, 595, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [595, 610, "Pop Papierstad", "k", "Plom is jarig en krijgt van zijn vriendjes een Ja-lijst! Hij mag kiezen wat hij allemaal wil doen en iedereen moet dan zorgen dat het voor elkaar komt. Maar de lijst van Plom is wel heel erg lang."], [610, 615, "Knofje", "k", "Knofje is een eigenzinnig meisje van vierenhalf. Ze woont met haar moeder, vader en babyzusje Elisabeth in een flat waar ze van alles beleeft. Knofje onderzoekt dingen die normaal lijken te zijn voor ons, maar die buitengewoon zijn voor haar."], [615, 620, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [620, 630, "Beer Bo", "k", "Beer Bo onderzoekt de zaak waar Amelia's boterhammen met leverpastei zijn gebleven."], [630, 640, "Ridder Muis", "k", "In een vriendelijk, middeleeuws universum leven de licht ontvlambare Muis en de zachtmoedige Draak, twee onafscheidelijke vriendinnen. Wanneer Muis het weer eens op haar heupen krijgt, wil niemand in haar buurt zijn, behalve de verdraagzame Draak."], [640, 650, "Edmond & Lucy", "k", "Lucy breekt per ongeluk de dubbele fluit die Edouard haar geleend heeft en wil hem repareren."], [650, 660, "Vos en Haas", "k", "Om in Lola's ogen te schitteren, besluit Bernard een dappere ridder te worden om haar te bewijzen wat hij waard is. Hij vraagt Rock om hem te helpen een draak te bouwen die hij kan verslaan om indruk te maken op zijn geliefde."], [660, 665, "Kaatjes Kameraadjes", "k", "Viktor is kwaad omdat hij niet goed kan voetballen wanneer het waait. Kaatje probeert hem op te vrolijken, maar dat lukt niet goed. Tot kameraadjes Jade en Hanne tonen dat je heerlijk kunt vliegeren op het strand wanneer er veel wind staat."], [665, 675, "Toet Toet Cory Carson", "k", "Wanneer de bal van Cory en zijn vrienden vast komt te zitten op het dak, moeten ze als ??n team samenwerken om hem terug te krijgen."], [675, 680, "Slaapwel", "k", "De babykangoeroe voedt zichzelf in de buurt van zijn moeder in het maanlicht, om de hitte van de Australische dag te vermijden. Hij beweegt een beetje weg, genoeg om met zijn buurman te boksen en samen te springen."], [680, 685, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [685, 690, "Mironins", "k", "Een oude man brengt oosterse taferelen tot leven door heel eenvoudige lijnen te tekenen. Wanneer hij de Mironins zijn schildertechniek bijbrengt, oefent Blu geduldig, maar Ro en Low krabbelen en cre?ren chaos."], [690, 700, "Yetili vertelt", "k", "Nina en Leon proberen een gek insect te vangen dat de boekwinkel binnen is gekomen. Dat doet Yeti denken aan een verhaaltje. Hij vertelt over vier jagers. Drie weten hoe ze vogels moeten vangen, maar eentje wil eigenlijk liever naar ze kijken."], [700, 710, "Casper en Emma", "k", "Het is een bijzondere dag, omdat Casper een nachtje bij Emma blijft slapen. Haar opa neemt de kinderen mee in een bootje en ze gaan met hengels en klapstoelen vissen in een beek. Dan raakt Emma haar schoen kwijt, ze zoekt overal."], [710, 715, "Samson en Marie", "k", "Wanneer Samson en Marie gaan slapen worden ze overvallen door het geluid van een mug."], [715, 720, "Samson en Marie", "k", "Samson speelt met de dominostenen. Hij wil de langste rij steentjes ooit bouwen en gaat aan de slag. Maar Marie laat de dominosteentjes telkens per ongeluk omvallen nog voor ze een lange rij hebben gevormd."], [720, 730, "Mush Mush en de Zwammetjes", "k", "Sep is blij dat Amanita ge?nteresseerd is in zijn verzamelingen en biedt aan haar te laten zien hoe hij schatten opgraaft. Maar het wordt lastig wanneer de leerling de meester overtreft."], [730, 735, "Zig & Sharko", "k", "Sharko en Marina zorgen voor een baby-octopus. Ondanks de inspanningen van Marina om een perfecte moeder te zijn, kan alleen Sharko de baby kalmeren, terwijl Zig en Bernie alle pogingen van de zeemeermin saboteren."], [735, 750, "Wannabe's", "k", "Olly moet Mike helpen met het organiseren van zijn papieren. Olly gaat met tegenzin aan de slag, maar dan is Mike zijn perforator plots verdwenen. Olly kan dus niet meer verder werken."], [750, 765, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [765, 790, "Mega Mindy", "k", "Als een van de beruchte Kriminalsky-broers wordt gearresteerd, is dat gevaarlijk voor Migrain en het politiekorps. En Mega Mindy kan pas komen helpen wanneer de generator van opa Fonkel weer gemaakt is..."], [790, 800, "Mega Maffe Monsterfreaks", "k", "Er heerst onrust in Griezelbeek. Onschuldige kinderen worden lastiggevallen en beroofd van hun lunchgeld. Dit zou een zaak kunnen zijn voor de Monsterpolitie."], [800, 825, "100% Wolf: De legende van de maansteen", "k", "Een magisch foutje zorgt ervoor dat de studenten per ongeluk een gloednieuw wezen cre?ren. Dit leidt ertoe dat de veiligheidsinspecteur langs moet komen op de school."], [825, 835, "Coop Troep", "k", "Wanneer Puppy Mac alleen naar het park wil lopen, overtuigt de troep Sam om hem te laten gaan, omdat ze hem de hele weg in de gaten zullen houden. Maar wanneer elk lid zijn dekmantel verraadt, rent Mac weg en leidt hen op een dolle achtervolging."], [835, 840, "Kleine dingen", "k", "Nadat ze een speelgoedmicrofoon hebben gevonden, zingt iedereen zijn eigen unieke solo."], [840, 845, "Tik Tak", "k", "Een magische lampenkap van zeilschepen en een theater van dansende grootvaders klokken."], [845, 850, "Bumba", "k", "Arro en Bumba gaan samen muziek maken in de ruimte. Ze leren het woordje trommel."], [850, 855, "Timbalo", "k", "Zet de voorwerpen op de juiste plaats, zoek met Zaza mee naar het voorwerp en Pepe bakt ondertussen pannenkoeken. Zaza, Toto en Pepe rijden nog langs bij Mimi om te tanken en dag te zeggen."], [855, 860, "Uki", "k", "Uki en Egel maken een sneeuwpop met stenen, knopen en een emmer. Ze weten alleen niet wat ze met de neus moeten doen. Ze gaan op zoek naar een wortel als neus. Konijn huppelt langs, struikelt en valt tegen de sneeuwpop."], [860, 865, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [865, 870, "Meneer Papier", "k", "Het flitst en dondert. Op het ritme van de bliksem spelen Meneer Papier en Poes op hun instrumenten. Het onweer slaat in een boom, die in vlammen opgaat. Meneer Papier knipt een brandweerauto en gaat snel op pad om het vuur te blussen."], [870, 875, "Kaatjes Kameraadjes", "k", "Kaatje en Kamiel weten geen raad met het onweer. Kameraadjes Liam en Jassim bedachten een fantastisch onweersspel dat ze spelen wanneer het dondert en bliksemt."], [875, 880, "Charlie", "k", "Het appelsap is op, en Charlie stelt voor om zelf sap te maken van de appels uit de tuin. Hij nodigt al zijn vriendjes uit om mee te doen."], [880, 885, "Pol de Piratenmuis", "k", "Kapitein Pol en haar vrienden zijn op jacht naar schatten! Ze zien een vreemd voorwerp in het water liggen, een dennenappel. Maar kunnen dennenappels echt een schat zijn? Pol is hiervan overtuigd."], [885, 894, "Yetili vertelt", "k", "Nina en Leon tekenen een boek, maar het is nog niet klaar. Yeti kiest een boek uit om voor te lezen. Het gaat over Willy die liever leest en naar muziek luistert. Hij wordt gepest, maar Willy besluit om voor zichzelf op te komen."], [894, 900, "Rintje", "k", "Rintje helpt bij oma het servies uitzoeken. Wat oud en versleten is moet weg, de rest gaat in de kast zodat het goed bewaard blijft. Als Rintje vervolgens met oma tikkertje en verstoppertje wil spelen merkt hij dat oma niet meer hard kan rennen."], [900, 905, "Lena's Boerderij", "k", "Een lieveheersbeestje zit vast in de staart van een koe. Een vlieg wil helpen, maar de koe moet wel stil blijven staan. Hoe legt zo'n klein vliegje dat uit aan zo'n grote koe?"], [905, 915, "Sam & Julia", "k", "Julia verliest een knikker aan Tonio. Als ze erachter komt dat die van Sam was, doen zij en Sam er alles aan om hem terug te krijgen."], [915, 920, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [920, 930, "Kabam!", "k", "De kinderen uit groep 3a. De kinderen in de klas zijn onderling verschillend, maar ??n ding hebben ze gemeen: zij zijn allemaal wel eens bang. Gelukkig heeft ieder kind ook een rijke fantasie die helpt om met zijn of haar angst om te gaan."], [930, 935, "Lu en de dolle boel minis", "k", "Lou breekt per ongeluk Barnaby's takje. Barnaby is verdrietig en Lou voelt zich erg schuldig."], [935, 945, "Aap, Poot, Pies", "k", "Aisia wil een huisdier, maar dat blijkt lastiger dan ze had gedacht. Luc vindt dat onzin omdat er genoeg dieren om hen heen zijn."], [945, 950, "Saïd & Anna", "k", "Sa?d geeft hemzelf en Anna op voor een optreden op het Muziek Open Podium, maar er is ??n probleem: ze kunnen geen instrument bespelen. Zullen ze op tijd iets bedenken om toch mee te doen?"], [950, 955, "Samson en Marie", "k", "Marie maakt spruitjes klaar, maar dat is niet naar de zin van Samson. Marie sluit een deal. Als ze voor Samson een hoop spruitjes mag opscheppen, krijgt hij een ijsje. Samson gaat akkoord, maar heeft een plannetje..."], [955, 960, "Samson en Marie", "k", "Marie wil meer humor in hun show. Er moet meer gelachen worden. Daarom zal ze in het vervolg tussen de liedjes door grapjes vertellen. Echte stand-upcomedy. Maar Samson begrijpt de grappen niet."], [960, 965, "De avonturen van kleine pinguïn", "k", "Leah bestudeert haar achtergrond. Oscar heeft veel plezier met de drie Ninjapingu?ns."], [965, 975, "Interstellar Ella", "k", "Ella, Slippy, Madhu, Ilo en Gem spelen verstoppertje. Ella kan Slippy niet vinden en wordt ongerust."], [975, 985, "Het betoverde dorp van Pinokkio", "k", "Pinokkio en Kasimir willen stiekem wat lekkers bakken in de keuken van Mangiafiamma, maar als Bettina per ongeluk een ketel betovert, staat het hele dorp op zijn kop."], [985, 995, "De Marsupilami's", "k", "De tweeling moet op Lalou's smoothiebar letten en de Marsu's cre?ren de beste smoothie ooit. Mica doet alsof hij de smoothie bedacht heeft, maar als hij een live demonstratie moet geven, schieten de Marsu's hem te hulp."], [995, 1010, "De Chimera Wachters", "k", "Thelma wil dolgraag de kleintjes van Blaardepoema tonen aan Herson, maar als Blaardepoema hen ontdekt, ontstaat er een waar Chimera-gevecht."], [1010, 1035, "Draken: beschermers van Berk", "k", "Terwijl ze naar valstrikken zoeken, lopen Braak en Burp in de val terwijl er een bosbrand nadert."], [1035, 1040, "Beroepen", "k", "Om beter te begrijpen waaruit bepaalde beroepen bestaan, leggen schoolkinderen met hun woorden de beroepen van hun ouders uit."], [1040, 1075, "Nachtwacht: Het Kristal van het Kwaad", "k", "De Nachtwacht wordt door de president van de Hoge Raad, Xantara, beschuldigd van een zware misstap, waarna ze hun krachten verliezen. Al snel ontdekken ze Xantara's ware intenties: met het Kristal van het Kwaad wil ze de mensenwereld vernietigen."], [1075, 1085, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1085, 1110, "GameKeepers", "k", "Mats en Sari komen terecht in een spannende racegame. Met een sleutel moeten ze de wagen starten, om vervolgens de race te winnen. Als ze verliezen is het voor altijd game over. Maar dan verschijnt er plots een muur voor hen op straat."], [1110, 1125, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [1125, 1145, "Lettersoep", "k", "Krachtpatsers Sem en Mathijs nemen het op tegen het duo Caster en Marius."], [1145, 1150, "Grizzy & the Lemmings", "k", "Wanneer Grizzly per ongeluk zijn favoriete bank vernielt, ziet hij een charmant vissershuisje op een naburig eiland. Hij grijpt de kano van de Lemmingen, maar ontdekt dat de hut vervallen is. Gelukkig is er een prachtige jacht in de buurt."], [1150, 1160, "De regels van Floor", "k", "Er worden schoolfoto's gemaakt. Als Floor ziet hoe erg de grote pukkel op haar hoofd eruit ziet, doet ze er alles aan om opnieuw op de foto te mogen. Dat had ze beter niet kunnen doen."], [1160, 1185, "Spellbound", "k", "Cece en Bash helpen Mia om haar speciale Wizen-kracht te vinden, maar ongeluk zit in een klein hoekje. En Jade houdt alles goed in het oog."], [1185, 1195, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1195, 1200, "Zo Cool!", "k", "Wist je dat er goud zit in het menselijk lichaam? Is het waar dat we sterker worden van spinazie te eten? Dit zijn het soort vragen die simpel lijken, maar waar we het antwoord niet op kennen."], [1215, 1260, "VRT NWS journaal met VGT", "n", "Nieuws en sport, getolkt in Vlaamse Gebarentaal (VGT)."]], "vtm": [[1435, 1530, "De Verraders", "e", "De finale is aangebroken. Het is tijd voor de munt van de waarheid en de laatste verdenkingen aan de ronde tafel. Wie speelt het slimst en gaat uiteindelijk met de overwinning aan de haal?"], [1530, 1580, "Gooische Vrouwen", "f", "De vriendschap van Willemijn en Anouk staat op scherp als Anouk onthult dat Evert verliefd op haar is. Willemijn probeert met behulp van een medium wraak te nemen. Claire gaat op zoek naar een rijke nieuwe echtgenoot."], [1800, 1805, "Kabouter Plop", "k", "Kabouter Klus wil de nieuwe parelketting van Kwebbel van dichtbij bekijken. Hij trekt echter veel te hard aan het snoer, waardoor alle parels als knikkers over de vloer rollen."], [1805, 1810, "Kabouter Plop", "k", "Plop geeft vanavond een feestje voor zijn vrienden en op het menu staat taart. Klus heeft echter nu al zin in het gebak en hij bedenkt een truc om de avond eerder te laten beginnen."], [1810, 1820, "Bol & Smik", "k", "Bol vindt een vergrootmachine uit voor Smik. Maar het blijkt niet zo makkelijk om zo groot te zijn."], [1820, 1830, "Bol & Smik", "k", "Het verhaal van twee dikke vrienden die gekke avonturen beleven. Ze wonen samen in een gezellig huisje waarin ze al hun vriendjes ontvangen."], [1830, 1845, "De avonturen van Lolly Lolbroek", "k", "Lolly is jarig. Kara en Marx zijn dat echter vergeten en hebben geen cadeautje voor haar. Ook een feestje zijn ze vergeten te organiseren. Van Lex krijgen ze de Versnelfloepser. Hiermee kunnen ze alles op heel korte tijd nog regelen."], [1845, 1855, "Maya de Bij", "k", "Shelby vindt een flesje koninginnengelei op het weidepad. Wanneer hij hiervan drinkt, ontdekt hij dat dit drankje magische krachten heeft."], [1855, 1870, "Sinterklaaskapoentjes", "k", "Oeps. Pakjespiet heeft te veel speculaas besteld bij Speculaaspiet. Marie en James helpen mee de speculaas op te eten, zodat Sinterklaas het niet ontdekt. Marie maakt er speculaaspasta mee en Piet knutselt ook nog snel een aftelkalender."], [1870, 1885, "Maya de Bij", "k", "De weide wordt opgeschrikt door een nieuwe mier: Sashi-Mier. De mier daagt Paul uit tot een duel om het leiderschap van het mierenleger."], [1885, 1910, "Hallo K3", "k", "Als Josje terug komt uit de Verenigde Staten, blijkt ze verloofd te zijn. Haar geliefde zal binnen een paar dagen naar Belgi? komen om met haar te trouwen. Er barst een strijd los tussen Karen en Kristel om de titel van getuige te bemachtigen."], [1910, 1935, "Echte Verhalen: De Buurtpolitie", "k", "Koen vindt dat hij te hard moet werken in het huishouden. Tineke stelt hem voor om online op zoek te gaan naar een poetshulp. Zo komen ze een geval van kinderarbeid op het spoor."], [1935, 1955, "VLOGLAB Secrets #Stories", "k", "Deze jeugdserie volgt de vloggers van de Vloglabband. Liefde, vriendschap, maar vooral veel drama lijkt hen steeds te achtervolgen. Gelukkig hebben ze elkaar en een vriendschapsband waar niemand tussen kan komen."], [1955, 1975, "LEGO Friends: The Next Chapter", "k", "De studentenraad neemt idee?n aan voor het grote initiatief van dit jaar. Aliya probeert een voorstel te bedenken om de buurtbewoners te helpen, terwijl het slechte idee van Brad steeds populairder wordt."], [1975, 2000, "Arthur en de Minimoys", "k", "Koning Sifrat vertrekt op pelgrimage en benoemt Selenia tot koningin. Daardoor kunnen de drie helden de koning niet beschermen tijdens zijn reis. En daar maakt Malthazard handig gebruik van."], [2000, 2015, "Maya de Bij", "k", "Bijenwas denkt dat het geheim van de perfecte organisatie van de mieren in hun lied zit. Daarom steelt hij het. Maya wil de mieren helpen hun lied terug te krijgen."], [2015, 2030, "Open keuken met Sandra Bekkari", "l", "Voedingscoach Sandra Bekkari laat vanuit haar keuken zien hoe ze een gerecht met portobello's maakt. Van verse makreel maakt ze tartaar met munt en appel."], [2145, 2180, "Familie", "f", "Stefanie kan Simon overtuigen om zijn verhaal te doen. Josefien vangt Wesley op in de brouwerij. Hij neemt haar in vertrouwen en doet zijn verhaal. Hanne heeft haar trip naar Zweden moeten afzeggen door het werk."], [2180, 2220, "Florentina", "f", "Florentina ontdekt wie de opdrachtgever is van de witwaspraktijk. Sami is bezorgd over zijn vader ?n Florentina. Willem wil Manon dringend spreken, maar die ontwijkt hem. Wes en Manon spreken af."], [2220, 2250, "VTM Nieuws", "n", "Nieuws van de dag met achtergrondinformatie, gevolgd door uitgebreide sportverslaggeving."], [2250, 2260, "Het Weer (middag)", "n", "Blik op het weer in Vlaanderen en daarbuiten."], [2260, 2295, "Familie", "f", "Zjef onderneemt actie, maar verloopt niet zoals hij had gehoopt. Brahim ontvangt nieuws van de makelaar. Raven vertelt Louise over wat de plannen van V?ronique zijn met Victor. Ze is woedend. Mieke en Niko doen een vervelende ontdekking."], [2295, 2365, "Wittekerke", "f", "Nathalie hoopt om samen met Thibault de baby op te voeden, maar hij voelt er niets voor om papa te worden ?n al helemaal niet om met een zieke vrouw samen te leven. Zijn eerlijkheid komt zeer hard aan. Jan heeft Phaedra kunnen overtuigen."], [2365, 2420, "Gooische Vrouwen", "f", "Anouk vermoedt dat Tom zich afstandelijk gedraagt omdat hij vindt dat ze te veel werkt. Cheryl denkt daar anders over, en haar verklaring zorgt ervoor dat Anouk een verrassingslunch voor Tom wil organiseren. Claires liefdesleven staat op zijn kop."], [2420, 2440, "America's Funniest Home Videos", "o", "Amerikaanse show rond grappige, waargebeurde videobeelden, ingestuurd door de kijkers. Elke week kan het studiopubliek aangeven welke clip zij het grappigst vinden."], [2440, 2475, "Lisa", "f", "Lisa wint een Meet & Greet met Sean Dhondt. Gert verwijt Babette dat ze een spionne is, Babette ontkent, maar breekt met Gert. Katja weet Jonas te overtuigen om toch te trouwen tijdens de opnames van de reclamespot van Tasha."], [2475, 2540, "Camping Coppens", "e", "Neefje Marcel arriveert op Camp Grinsby, tot grote vreugde van Beau. Nora leert autorijden en zet zo een stap richting zelfstandigheid. Iedereen bereidt zich voor op een storm, terwijl Monique onverwacht wordt gebeld door de Zweedse schaatsfederatie."], [2540, 2580, "Florentina", "f", "De charmante, maar onzekere Flo werkt in het wellness- en fitnessimperium van haar moeder, waar een slanke lijn heilig is. Zelf voldoet ze echter niet aan dat klassieke schoonheidsbeeld."], [2580, 2635, "VTM Nieuws", "n", "Nieuws van de dag met achtergrondinformatie, gevolgd door uitgebreide sportverslaggeving."], [2635, 2645, "Het Weer", "n", "Blik op het weer in Vlaanderen en daarbuiten."], [2645, 2680, "Familie", "f", "Het nieuws over de arrestatie verspreidt zich als een lopend vuurtje en speculaties steken de kop op. V?ronique is er zeker van dat Simon het brein is achter alles. Erik springt haar te hulp."], [2680, 2760, "Mijn Restaurant", "o", "Vier duo's ontdekken de punten van geheime recensenten. Twee restaurants beginnen vervolgens in alle rust aan hun service, terwijl drie andere de jury verwachten."], [2760, 2795, "Alloo bij de Wegpolitie", "o", "Een chauffeur blaast positief bij een alcoholcontrole en is zijn rijbewijs kwijt. De politie stopt ook een bestuurder met valse nummerplaten en een verlopen keuring. Zijn trip naar Tomorrowland eindigt abrupt bij de keuring."], [2795, 2855, "Chicago Fire", "o", "Herrmann voelt zich ongemakkelijk wanneer een letselschade-advocaat zich bemoeit met een gewone interventie. Kazerne 51 krijgt bezoek."], [2855, 2920, "Camping Coppens", "e", "Neefje Marcel arriveert op Camp Grinsby, tot grote vreugde van Beau. Nora leert autorijden en zet zo een stap richting zelfstandigheid. Iedereen bereidt zich voor op een storm, terwijl Monique onverwacht wordt gebeld door de Zweedse schaatsfederatie."], [2920, 2980, "Gooische Vrouwen", "f", "Anouk vermoedt dat Tom zich afstandelijk gedraagt omdat hij vindt dat ze te veel werkt. Cheryl denkt daar anders over, en haar verklaring zorgt ervoor dat Anouk een verrassingslunch voor Tom wil organiseren. Claires liefdesleven staat op zijn kop."]], "vtm2": [[10, 65, "9-1-1", "o", "Het team van de 118 moet een peuter redden die vastzit in een pijp."], [65, 120, "Mr. Frank Visser Doet Uitspraak", "e", "John en Geraldine zijn eigenaar van een volkstuintje waar ze in alle rust de bloemetjes buiten kunnen zetten. Tot hun grote teleurstelling is er echter al van begin af aan gedonder met de buren."], [680, 750, "MasterChef Australië", "e", "De emoties lopen hoog op als de vijf koks kisten openen en daarbij foto's van hun eigen kookhelden onthullen. Ge?nspireerd door de foto's van hun moeders en grootmoeders, vechten ze voor de laatste kans op immuniteit."], [750, 805, "Kitchen Nightmares", "e", "Gordon Ramsay gaat naar eetcaf?, The Olde Stone Mill in New York. Het is gerenoveerd, maar de service en het eten zijn nog steeds waardeloos."], [805, 885, "B&B zoekt Lief NL: Winter", "e", "Berggids Klaas zoekt hoog in de Oostenrijkse Alpen voorzichtig zijn weg in de liefde. Verderop in Oostenrijk rolt er een nieuwe liefdesgast Claudia's erf op, wat voor de nodige beweging zorgt in haar liefdeszoektocht."], [885, 955, "MasterChef Australië", "e", "De koks moeten ingredi?nten tackelen die de extreemste smaken ter wereld hebben. Namelijk de pittige chilipeper Carolina Reaper, de extreem zoete monkfruit, de zoutzure umeboshi, de penetrante Franse kaas ?poisses en de bittermeloen."], [955, 1015, "Achter gesloten deuren", "e", "John leerde een jaar geleden de liefde van zijn leven kennen. Hij moet haar echter nog opbiechten dat hij zich geen man voelt, maar vrouw."], [1015, 1070, "Kitchen Nightmares", "e", "Chef Ramsay helpt Mohammed, de eigenaar van het Indiase restaurant Dillon's in New York. Ramsay vindt het een van de smerigste restaurants die hij ooit heeft gezien."], [1070, 1150, "B&B zoekt Lief NL: Winter", "e", "Een uitje naar de verfwinkel levert bij Claudia in Oostenrijk onverwacht spanning op. Verderop in Oostenrijk brengt bij Klaas de volgende single een nieuwe dynamiek met zich mee. In Andorra onderzoeken Andr? en Myl?ne hun teamspirit op de werkvloer."], [1150, 1180, "Home and Away", "f", "Roo maakt zich zorgen, omdat Alf weer met de auto rijdt. Leah en Martha proberen hem intussen te overhalen om zijn vertrek naar Merimbula uit te stellen."], [1180, 1235, "Mr. Frank Visser Doet Uitspraak", "e", "Ellens woongenot wordt de laatste jaren behoorlijk vergald door haar stalkende buurvrouw. Het stalken gaat volgens haar zelfs gepaard met doodsbedreigingen en oplichting."], [1235, 1295, "Overtreders", "o", "In Rotterdam heeft iemand een erg kort lontje, terwijl in Amsterdam de emoties hoog oplopen."], [1295, 1370, "Kees van der Spek: Oplichters Aangepakt", "o", "Na een hersenbloeding raakte Jan gehandicapt, waarna hij zijn financi?le zaken toevertrouwde aan een jurist, maar die plunderde zijn rekening en verdween spoorloos. Kees en zijn team sporen de man op in Thailand."], [1370, 1445, "Het Heizeldrama", "o", "Een terugblik op het Heizeldrama van 1985. Wat een feestelijke finale tussen Liverpool en Juventus had moeten worden, eindigt in een nachtmerrie. De spanning tussen de supporters escaleert snel, met 39 doden tot gevolg."], [1445, 1505, "Fare Dodgers: At War With The Law", "o", "Onderzoekers van Transport for London, Rich en Greg, volgen een man in East London die vermoedelijk meer dan 1.500 Britse pond aan onbetaalde ritten op de Elizabeth Line heeft opgelopen."]], "vtm3": [[60, 85, "The Big Bang Theory", "o", "Sheldon maakt plannen voor een diner ter ere van Amy's verjaardag. Verder ontvangt Leonard een kerstkaart van zijn broer."], [360, 540, "Qmusic", "o", "Geniet van de allerleukste muziek met Qmusic. Livebeelden vanuit de radiostudio, Twitter- en Instagram-updates, videoclips, weerberichten en nog veel meer."], [825, 850, "Ghosts", "o", "Sam, Jay en de overgebleven geesten ontrafelen het mysterie van welke geest naar het hiernamaals is gegaan. Sam en Jay moeten een uil zien te verplaatsen om Jay's restaurant in een schuur te kunnen beginnen."], [850, 990, "The Hunger Games: Catching Fire", "o", "Na haar overwinning beginnen Katniss Everdeen en Peeta Mellark aan hun Zegetoer. Maar dan wordt een gruwelijke wijziging aangebracht in de volgende Hongerspelen."], [990, 1040, "Chicago P.D.", "o", "Het team onderzoekt een overval. Het bewijs leidt naar onverwachte verdachten. Een persoonlijk drama en mogelijk nieuw slachtoffer komen aan het licht. Burgess gaat de strijd aan met haar verleden."], [1040, 1095, "Chicago P.D.", "o", "Programma (herh.). Voor Brigadier Hank Voight en zijn team zijn regels eerder een richtlijn dan wet. Hun doel is Chicago beschermen en misdadigers op hun soms eigen wijze voor de rechter brengen."], [1095, 1125, "How I Met Your Mother", "o", "De vrienden willen een vrijgezellenfeestje voor Barney die legendarisch wordt. Ze nemen hem mee naar een geheime feestlocatie zonder iets te vertellen."], [1125, 1150, "Ghosts", "o", "Sam ontdekt dat een van de geesten de kracht heeft om de dromen van de levenden binnen te gaan en hun beslissingen te be?nvloeden. En twee van de geesten denken het geheim van overgaan te hebben gevonden."], [1150, 1180, "The Simpsons", "o", "Marge gooit Homer buiten nadat hij kerstavond bij Moe's heeft doorgebracht. Homer besluit doelloos door de stad te drentelen."], [1180, 1205, "The Big Bang Theory", "o", "Sheldon and Amy onderwerpen hun vrienden aan een serie geheime experimenten, die moeten uitwijzen wie het beste hun getuige kan zijn tijdens de bruiloft. Ondertussen onthult Penny haar ware gevoelens voor Amy."], [1205, 1235, "The Big Bang Theory", "o", "Amy en Leonard komen dichter tot elkaar tijdens een verzameling wetenschappelijke experimenten. Ondertussen vervangt Bert Howard in de band, en vindt Sheldon een vruchtbare wetenschappelijke inspiratiebron in Penny."], [1235, 1290, "De Bende van Jan De Lichte", "o", "De premiejagers hebben het op Jan voorzien en hij raakt gewond. Tincke redt hem maar ontdekt de beloning die er voor Jan uitgeschreven staat. Coffijn zoekt een partner voor zijn wegenbouwplannen."], [1290, 1355, "De Bende van Jan De Lichte", "o", "Tijdens een koetsoverval ontdekken de dieven een lading die ze helemaal niet verwacht hadden. De consequenties zijn groot en het leidt tot erg veel geweld. Bart probeert het te voorkomen, maar het lijkt allemaal mis te lopen."], [1355, 1410, "Snowpiercer", "o", "Ben gaat op missie en verzamelt monsters van het ijs, waarvoor hij Snowpiercer moet verlaten. Kevin probeert uit te zoeken wie er in het verzet zin vanaf Big Alice."], [1410, 1470, "Snowpiercer", "o", "Snowpiercer heeft een nieuwe overlevende binnengehaald. Layton heeft last van zijn visioenen, die steeds moeilijker te begrijpen zijn. Ruth en het verzet plannen een actie vanuit Big Alice."]], "vtm4": [[25, 75, "Police Interceptors", "o", "Een team achtervolgt de bestuurder van een wit busje die zich duidelijk niets aantrekt van snelheidslimieten. Wanneer de man het op een lopen zet, zet politiehond Quantum de achtervolging in."], [420, 600, "Willy", "o", "De Willy-dj's zorgen voor de beste platen met de nodige rock-'n-roll."], [850, 905, "Police Interceptors", "o", "Tijdens een stormachtige nacht volgt de politie een snel rijdende Astra die als gestolen is opgegeven. Ondertussen nadert het einde van de nachtdienst voor Moz en Kingo. Ze worden opgeroepen om een wietkwekerij in een woonstraat te onderzoeken."], [905, 960, "Police Interceptors", "o", "Jim Carrington en Lewis Marshall jagen op een bekende vijand, een Citro?n Picasso die de politie drie keer in een week heeft laten ontsnappen, terwijl Kingo en Chantelle worden opgeroepen voor een vermoedelijke aanval met een mes."], [960, 1015, "Xena: Warrior Princess", "o", "Hoewel Gabrielle vrede vindt, vindt Xena geweld op een idyllisch landgoed dat alleen wordt bewoond door de eigenaar en gekke verzorger."], [1015, 1070, "MacGyver", "o", "MacGyver werkt samen met een prachtige Russische overloper wanneer hem wordt gevraagd om de dubbelagent te identificeren die verantwoordelijk is voor de dood van drie agenten."], [1070, 1120, "Police Interceptors", "o", "Een team achtervolgt de bestuurder van een wit busje die zich duidelijk niets aantrekt van snelheidslimieten. Wanneer de man het op een lopen zet, zet politiehond Quantum de achtervolging in."], [1120, 1180, "Police Interceptors", "o", "Rob en Dan vallen in de vroege uurtjes binnen in een woning waarrond een vreemde geur wordt waargenomen. In het pand treffen ze metershoge marihuanaplanten aan."], [1180, 1235, "Police Interceptors", "o", "Jim en Lewis controleren meldingen van vermoedelijke vrachtwagen-plunderaars bij een tankstation in Trowell, waarbij politiehond Morse en zijn hondenkameraad Reno te hulp schieten."], [1235, 1365, "John Wick: Chapter 2", "o", "De gepensioneerde beroepsmoordenaar John Wick komt zijn oud-collega helpen als deze een plan beraamt om de controle over internationale organisatie van huurmoordenaars over te nemen. In Rome nemen ze het op tegen gevaarlijke moordenaars."], [1365, 1395, "Special Ops: True", "o", "Leden van SEAL Team Six treffen voorbereidingen voor een uiterst geheime missie om Osama bin Laden uit te schakelen."], [1395, 1425, "Sheriffs: El Dorado County", "o", "We volgen een S.W.A.T.-missie van de briefing tot de uitvoering. De politie arresteert een man die gezocht wordt voor mishandeling."], [1425, 1450, "Sheriffs: El Dorado County", "o", "Agenten proberen enkele agressieve zwervers weg te sturen die illegaal aan het kamperen zijn."], [1450, 1510, "Police Interceptors", "o", "Jim en Lewis controleren meldingen van vermoedelijke vrachtwagen-plunderaars bij een tankstation in Trowell, waarbij politiehond Morse en zijn hondenkameraad Reno te hulp schieten."]], "play4": [[70, 135, "De Tafel van Ruben", "e", ""], [360, 540, "Nostalgie: Sta Op! met Véronique De Kock", "x", "V?ronique De Kock sleurt je samen met Sander Vandenhende door de ochtendrush en zorgt ervoor dat je helemaal klaar bent voor de start van je werkdag."], [685, 740, "Huizenjagers", "l", "De nieuwe week start met een zoektocht naar een nieuwe woning voor Stijn en Bart. Zij zijn op zoek naar een huis waar ze zich echt thuis voelen."], [740, 815, "De Tafel van Ruben", "e", ""], [815, 860, "Komen Eten", "o", "Vier gasten, vier avonden, culinaire hoogstandjes en een flinke portie sfeer en gezelligheid."], [860, 935, "Blind Gekocht NL", "l", "Amanch en Deyar wonen in een koopflatje in Delft. Hun nieuwe onderkomen moet wel echt toekomstbestendig zijn, zeker met het oog op hun verleden. Zij zijn namelijk als politiek vluchteling naar Nederland gekomen. Kunnen Martijn en zijn team helpen?"], [935, 1010, "De Tafel van Ruben", "e", ""], [1010, 1060, "Huizenjagers", "l", "Sara en Vincent zijn al drie jaar op zoek naar hun ideale droomwoning. Ze willen een rustig gelegen, landelijke, vrijstaande woning met een grote tuin en eventueel een extra ruimte voor een kapsalon."], [1060, 1130, "De Slimste Mens Ter Wereld", "q", "Instapper: Kawtar Ehlalouch. Jury: Alex Agnew en Barbara Sarafian."], [1130, 1200, "Stukken van mensen", "o", "Een handtas van Herm?s, een salontafel van Paul Michel en minister Petra De Sutter verkoopt een schilderij van haar vrouw Claire. Ook nu is er een geheime koper die mogelijk roet in het eten gooit."], [1200, 1275, "De Tafel van Ruben", "e", ""], [1275, 1350, "De Slimste Mens Ter Wereld", "q", "Instapper: Dominique Persoone. Jury: Jan Jaap van der Wal en Bart Cannaerts."], [1350, 1420, "Over De Oceaan", "e", "Zeeziekte blijft genadeloos toeslaan en ook scheepskok Lynn krijgt het zwaar te verduren. Toch moet er eten op tafel komen. Wanneer eindelijk een indrukwekkende wahoo wordt gevangen, lijkt het tij te keren. Tot de kapitein plots ziek wordt."], [1420, 1480, "De Tafel van Ruben", "e", "Meest recente"]], "play5": [[70, 125, "NCIS: Hawaii", "f", "Terwijl Jane de ontvoering van Maggie onderzoekt, is ze geschokt wanneer ze de waarheid ontdekt. Vervolgens schakelt ze haar team en Whistler in om haar bevindingen te bewijzen."], [125, 165, "Fire Country", "f", "Een enorme boom valt om tijdens een opdracht tot herbebossing, waardoor Eves leven in gevaar komt. Het is vervolgens aan Bode om de reddingsoperatie te leiden."], [365, 405, "Grey's Anatomy", "f", "Een pati?nt slaagt erin een belangrijke mijlpaal te vieren met de hulp van Levi. Jo moet een moeilijke diagnose verwerken. Maggie en Winston maken een beslissing over hun toekomst."], [405, 430, "Friends", "f", "Chandler loopt de inmiddels gescheiden Janice tegen het lijf en vindt haar nog irritanter dan ooit. Ross spelt rugby om indruk te maken op Emily, en Monica probeert erachter te komen waar een geheimzinnige schakelaar in haar appartement voor is."], [430, 450, "Friends", "f", "Rachel organiseert een nepafscheidsfeestje voor Emily met als oogmerk dat ze ook buiten het werk contact met Joshua kan hebben, en de zwangere Phoebe snakt naar vlees."], [450, 470, "Modern Family", "f", "Shorty, een vriend van Jay, brengt meer tijd met Gloria door dan Jay zelf. Alex wil aan Claire bewijzen dat ze een seksuele relatie met Ben heeft."], [500, 525, "Modern Family", "f", "Phil en Claire willen Halloween nog steeds groots vieren, maar het lijkt erop dat niemand hun enthousiasme deelt en ze vragen zich dan ook af of de rest misschien gelijk heeft."], [525, 580, "Castle", "f", "Een vrouw geteisterd door schuldgevoel bekend een moord, maar tegenstrijdig bewijs maakt de zaak ietwat ingewikkelder. Het blijft trouwens ook niet bij deze ene bekentenis."], [580, 635, "Castle", "f", "Beckett wordt gevraagd om te assisteren bij een onderzoek naar drugshandel. Maar wanneer een eenvoudige undercoveroperatie verkeerd gaat staat ze plotseling oog in oog met de New Yorkse onderwereld."], [635, 685, "Elsbeth", "f", "Voormalig kindster Mac wordt op Halloween wakker met geheugenverlies en vermoedt dat ze een moord heeft gepleegd. Elsbeths team helpt haar de waarheid te achterhalen. Wagner heeft te maken met een laag moreel in het district."], [685, 745, "Elsbeth", "f", "Elsbeth en het team onderzoeken de dood van een medewerker van de meest exclusieve juwelierszaak van New York. Ze ontdekken dat er plannen zijn voor een overval op een gala."], [745, 795, "NCIS", "f", "Onderweg naar een bespreking in het Witte Huis, werd een marineofficier vermoord. Het NCIS-team zoekt naar het juiste motief: een overval, zijn slechte huwelijk of iemand die de bespreking met de president wilde voorkomen."], [795, 850, "Fire Country", "f", "Bode en de andere gevangenen werken samen met de brandweerlieden van Station 42 om een immense brand te bestrijden, die uitbreekt na een vliegtuigcrash. De bemanning verwelkomt een nieuw lid in de familie."], [850, 905, "NCIS: Sydney", "f", "Wanneer de moord op een FBI-agent in Fiji het team opnieuw in het gevaarlijke web van The Collective trekt, krijgt Mackey onverwacht te maken met een ingewikkelde familiere?nie."], [905, 965, "NCIS: Sydney", "f", "Het team levert in een zinderende strijd alles wat ze hebben om het syndicaat The Collective definitief op te doeken en hun dierbaren te beschermen."], [965, 1015, "Castle", "f", "Een Japanse balletdanser wordt op mysterieuze wijze vermoord. Wanneer Castle en Beckett onderzoek naar de zaak, worden ze opeens achterna gezeten door een gevaarlijke ninja."], [1015, 1070, "Castle", "f", "Een beurshandelaar wordt vermoord. Tijdens het onderzoek naar de zaak doen Castle en Beckett een schokkende ontdekking, het slachtoffer blijkt een informant."], [1070, 1125, "Elsbeth", "f", "Elsbeth onderzoekt de dood van een keukenmedewerker nadat deze grote schade heeft aangericht in het populairste restaurant van New York en een van Amerika's meest gerespecteerde chef-koks woedend heeft gemaakt."], [1125, 1180, "Elsbeth", "f", "De beroemde kerstcurator Dirk komt bij een ongeval om het leven. Elsbeth vermoedt vermoeden dat zijn vrouw achter zijn dood zit. Ondertussen krijgt Elsbeth een vakantieverrassing van Wagner en Kaya."], [1180, 1235, "NCIS: Hawaii", "f", "Jane wordt ondervraagd na de arrestatie van Maggie Shaw. Ondertussen onderzoekt de rest van het team een mysterieuze zaak omtrent mariniers die beschadigde gehoorgangen hebben door een ultrasonisch wapen. Ernie bezoekt zijn vriend dr. Tony Lee."], [1235, 1295, "Murdaugh: Death in the Family", "f", "Buster worstelt met de moord op zijn moeder en broer terwijl de politie naar de dader zoekt. Tegelijkertijd raakt Alex verstrikt in zijn verslaving en een berg leugens."], [1295, 1375, "Murdaugh: Death in the Family", "f", "De Murdaughs wonen het moordproces van Maggie en Paul bij. Buster zoekt naar de waarheid, terwijl hij worstelt met de negatieve aandacht van het publiek."], [1375, 1400, "Friends", "f", "De jongens merken dat hun TV gratis een pornozender ontvangt, en Phoebe ontdekt dat ze een drieling krijgt. Ross en Emily bevinden zich nog steeds aan weerszijden van de Atlantische Oceaan en proberen helder te krijgen wat ze voor elkaar voelen."], [1400, 1435, "Friends", "f", "Phoebe mag een naam bedenken voor een van haar baby's. Rachels plannen om haar vriendje te verleiden lopen mis, en Joey flapt er tegenover Chandler uit dat hij zijn naam vreselijk vindt. Ross maakt zich zorgen over zijn relatie met Emily."], [1435, 1470, "Modern Family", "f", "Claire is vastbesloten om te compenseren voor het feit dat ze niet bepaald vrolijk was op de bruiloft van Jay en Gloria door een feestje te organiseren ter ere van hun tienjarig jubileum."], [1470, 1530, "Modern Family", "f", "Tijdens zijn Thanksgiving-toast prijst Jay de hele familie voor haar recente successen, ook al weet iedereen dat hij niet helemaal de waarheid spreekt."]], "play6": [[85, 205, "Wordt aangekondigd", "o", "De programmering wordt nog aangekondigd."], [205, 250, "See No Evil", "o", "In Pierce County, Washington, wordt het lichaam van een vrouw in brand gestoken naast een doodlopende weg. Rechercheurs hebben moeite om het slachtoffer te identificeren totdat camera's leiden naar een schokkende ontdekking bij het huis van de vrouw."], [395, 435, "Bar Rescue", "o", "In Jacksonville, Florida, probeert Jon Taffer een bar te redden die lijdt aan een ernstige identiteitscrisis en een gebrek aan leiderschap."], [435, 480, "Pawn Stars", "o", "Het team krijgt een gesigneerd Apollo 10-boek in handen. Chum roept de hulp in van zanger Joey Fatone voor zijn mening over een collectie beeldjes. En Rick probeert circusposters van Bob Hope te bemachtigen."], [480, 535, "Hawaii Five-0", "o", "Danny, die nog steeds herstellende is van zijn schotwond, vertelt zijn zoon Charlie een verhaaltje voor het slapengaan waarin Steve en een groep veteranen op jacht gaan naar een aantal nepkerstmannen die een geldwagen hebben beroofd."], [535, 590, "Nightwatch", "o", "Het legendarische French Quarter staat in het middelpunt van een drukke nacht. De hulpverleners behandelen meerdere bewusteloze pati?nten, een jonge vrouw die wordt aangevallen op een feestje en een auto-ongeluk."], [590, 615, "That '70s Show", "f", "Het is Halloween en de bende gaat naar hun oude, verlaten, afgebrande basisschool. De dossiers die ze daar vinden, bevatten lang verloren gewaande geheimen en dat levert spanningen op."], [615, 650, "That '70s Show", "f", "Wanneer de groep naar Vanstock gaat, komt Kelso in de problemen omdat hij Laurie heeft uitgenodigd nadat Jackie zei dat ze niet ging, maar Jackie heeft zich bedacht en gaat toch mee."], [710, 765, "History's Greatest Escapes With Morgan Freeman", "o", "Zes mannen ontsnapten onder leiding van meesterbrein Nuno Pontes uit de Pittsburgh State Penitentiary door te graven onder de muur van de gevangenis. Ze bereikten Texas, maar werden betrapt."], [765, 795, "Storage Wars", "o", "De kopers maken het elkaar moeilijk op de veiling in Torrance, Californi?. Brandi vindt dat Jarrod te veel uitgeeft, en beperkt zijn budget tot 500 dollar. Een zelfverzekerde Dave maakt Ren? kwaad. Ivy verrast zichzelf als hij van tactiek verandert."], [795, 825, "Storage Wars", "o", "Een compilatie van bijzondere koopjes van het vader en zoon team Darrell en Brandon Sheets."], [825, 885, "See No Evil", "o", "In Pierce County, Washington, wordt het lichaam van een vrouw in brand gestoken naast een doodlopende weg. Rechercheurs hebben moeite om het slachtoffer te identificeren totdat camera's leiden naar een schokkende ontdekking bij het huis van de vrouw."], [885, 940, "Bar Rescue", "o", "Jon gaat naar Fountain Hills in de staat Arizona om een getrouwd stel te helpen hun investering in een bar te beschermen. Deze bar loopt op de klippen door hun vriend en zakenpartner."], [940, 995, "Pawn Stars", "o", "Een verkoper komt naar het pandjeshuis met Apollo 11-documenten. Chum bekijkt een topper uit 1962 van Harley-Davidson. Rick onderzoekt een ets van Renoir. En de jongens houden een vriendschappelijke wedstrijd."], [995, 1025, "That '70s Show", "f", "Wanneer Donna aan Eric laat weten dat ze van hem houdt, staat hij met zijn mond vol tanden. Kelso wordt ondertussen geplaagd omdat hij eruitziet als de Fonz in zijn nieuwe leren jas."], [1025, 1060, "That '70s Show", "f", "Donna sluipt de kamer van Eric binnen voor een middernachtelijk bezoekje, maar ze hebben geen seks. Dit leidt tot veel grappen van de jongens. Hyde krijgt een baan bij een foto-ontwikkelwinkel."], [1060, 1085, "The Simpsons", "o", "Lisa moet een mysterie oplossen op een schip waar niemand van boord kan wanneer Comic Book Guys actiefiguur van een miljoen dollar wordt vermoord tijdens een popcultuurcruise."], [1085, 1115, "The Simpsons", "o", "Homer en Bart worden koningen van de lokale sportwereld, maar Marge is achterdochtig."], [1115, 1145, "Storage Wars", "o", "Kluisjesloper Barry Weiss, bekend als De Verzamelaar, maakt het veilingproces nog leuker in deze collectie uit de archieven van Storage Wars."], [1145, 1175, "Storage leon met een bij speelt."], [365, 370, "Bumba", "k", "Bumbina speelt eerst met een bal samen met Babaki. Daarna gaan ze muziek maken met de ukulele."], [370, 375, "Timbalo", "k", "Tel de voorwerpen in de winkel van Toto, sorteer het afval in de juiste vuilbak, maak een moza?ek met fruit en raad wie er tevoorschijn komt. Mimi zorgt voor lekkers terwijl Zaza aan de telefoon is."], [375, 380, "Ellie de olifant", "k", "Ellie de Olifant en haar vriendjes turen naar de wolken en zien de mooiste figuren. Iedereen droomt ervan om te vliegen. Pelikaan neemt de vrienden ??n voor ??n mee in zijn snavel voor een vlucht, maar zijn snavel is niet groot genoeg voor iedereen."], [380, 385, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [385, 390, "Simon", "k", "Het sneeuwt op kerstavond en Simon is bang dat de Kerstman niet kan komen door het slechte weer. Hij besluit hem te helpen door samen met Gaspard een landingsbaan aan te leggen in de tuin."], [390, 395, "Kaatjes Kameraadjes", "k", "Eendje is ziek en Kaatje raakt in paniek, want ze weet niet hoe ze Eendje kan helpen. Viktor weet het ook niet, maar kameraadje Arthur laat hen zien dat je met een ziek dier naar de dierenarts kunt gaan."], [395, 405, "Dropje", "k", "Dropje pakt zichzelf in als cadeau voor Pippa. Eigenlijk is alles een cadeau als je het maar inpakt."], [405, 410, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [410, 415, "Bing", "k", "Bing en Flop bouwen een zandkasteel in de zandbak en later komt Pando meehelpen met zijn opwindbare kiepwagen. Bing vindt een leuk dingetje om op de toren van het kasteel te zetten."], [415, 420, "Toet Toet Cory Carson", "k", "Op een bloedhete zomerdag in Bumperdijk horen Cory en zijn vriendjes het bekende deuntje van de ijscokar. De kinderen volgen het geluid en kijken uit naar de zoete, verkoelende traktatie."], [420, 430, "Mojo Wisseltop", "k", "Bolleboos Preston wil een foto van een superzeldzame vogel. Mojo en Bo helpen hem met zijn vogelballon, maar het wordt een dolle vlucht."], [430, 435, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [435, 445, "Biggen Bouwers", "k", "De biggen moeten een gigantisch nest bouwen voor de mysterieuze Kwaak Kwaak. Keith is zo opgewonden dat hij zijn taart wil geven aan het wezen. Maar dan ontdekken de biggen dat Wilf alles verzonnen heeft om de taart te kunnen spelen!"], [445, 449, "Samson en Marie", "k", "Bobijntje heeft Samson gevraagd om voor een gewond vogeltje te zorgen. Marie zal het vogeltje helpen en gaat op zoek naar haar EHBO-koffer. Maar wanneer Samson Marie in de weer ziet met een hamer, heeft hij er plots geen vertrouwen meer in."], [449, 455, "Molang", "k", "Merlijn helpt iedereen die hulp nodig heeft met een draai aan zijn toverstaf. Molang en Piu Piu proberen hem duidelijk te maken dat er ook voldoening te vinden is in het zelf doen."], [455, 465, "De Smurfen", "k", "Het is Prank Festivaldag en Lol Smurf is super enthousiast. Wanneer hij zich echter realiseert dat de smurfen elkaar uithalen en de zijne negeren, is Lol Smurf boos en verlaat hij het dorp."], [465, 480, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [480, 505, "Draken: beschermers van Berk", "k", "Bagger en Prut ontdekken bij toeval een Skrill, en de groep moet hem beschermen tegen de Barbaren."], [505, 515, "De 3 Musketiers", "k", "Richelieu wil land in handen krijgen dat toebehoort aan Henri, de koninklijke hovenier. Hij beveelt Milady om hem in de val te lokken met een parfum dat de jonge man gecre?erd heeft. D'Artagnan en Athos doen er alles aan om zijn naam te zuiveren."], [515, 525, "Grizzy & the Lemmings", "k", "Grizzy verdrijft de Lemmingen uit hun hut. Onderweg vinden ze een drakenbeeld in een tempel met een mysterieuze steen. Door deze aan te raken, verschijnt er een tatoeage op hun buik en krijgen ze beheersing van kungfu."], [525, 530, "Karrewiet met VGT", "n", "Infomagazine voor de jeugd. Getolkt in Vlaamse Gebarentaal (VGT)."], [530, 535, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [535, 540, "Kleine dingen", "k", "Nadat ze een bal hebben zien rollen, probeert iedereen over de matten te rollen."], [540, 600, "Een nieuwe vriend voor Dikkie Dik", "k", "Dikkie Dik en Poes Muis ontdekken op een koude dag dat er sneeuw ligt. Ze ontmoeten ook een nieuwe buur: een luidruchtige hond die Blaf heet. De poezen schrikken en rennen weg. Blaf volgt hen overal, maar misschien is hij niet zo eng als hij lijkt."], [600, 605, "Sarah leest voor", "k", "Sarah woont in een kleurrijke blokkentoren met een gezellig voortuintje aan de rand van de stad. Ze betovert iedereen met haar mooie glimlach en leest graag 'de avonturen van Sokpop' voor. Lezen jullie allemaal mee?"], [605, 625, "Halloween met Toet Toet Cory Carson", "k", "Cory, Chrissy en Freddy gaan op Halloween op zoek naar extra grote chocoladerepen. Het trio komt terecht in een enge hoek van de stad en moet een doolhof, een monstertruck en een spookhuis trotseren."], [625, 630, "Tik Tak", "k", "Een textiele westerse wereld, een puzzel van een schoolbank e n Boekenjongen maakt een watermolen."], [630, 635, "Bumba", "k", "Bumba en Zinzi zien een leeuw als ze voetballen en laten ook een voetbal op Bubalo's hoofd vallen."], [635, 640, "Timbalo", "k", "Puzzel mee met Mimi en kijk wat Zaza blaast met de bellenblazen. Toto rijdt op een gocart en samen spelen ze de stoelendans, wie blijft er over?"], [640, 645, "Uki", "k", "Het is een koude dag en Konijn rilt. Een sjaal houdt hem lekker warm, maar zijn oren blijven koud. Uki wil zijn vriendje helpen en vindt een hoed. Maar deze is te klein, terwijl een ander te groot is. Uki denkt dat sokken over de oren kunnen werken."], [645, 650, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [650, 655, "Ollie", "k", "Een verrassingsbezoeker onderbreekt Ollies theekransje. Hij is blij iemand te ontmoeten, maar Charles is argwanend."], [655, 660, "Flanel & Pluis", "k", "Waterdruppels vallen op de vloer. Pluis is gefascineerd door het water, maar wil niet nat worden! Hoe kunnen ze de druppels vangen en toch droog blijven?"], [660, 665, "Kaatjes Kameraadjes", "k", "Frits en Frats zijn vies geworden van het buiten spelen. Wanneer ze van Kaatje in bad moeten, willen ze niet. Kameraadje Tille laat zien dat dieren ook in bad moeten en verzorgd moeten worden, ook haar hondje gaat naar de hondenkapper."], [665, 675, "Ridder Muis", "k", "Meneer Heks heeft de toekomst gezien in zijn glazen bol. Ridder Muis is benieuwd wat dit betekent."], [675, 685, "Edmond & Lucy", "k", "Lucy en Edmond vragen zich af wie de oudste bewoner van het bos is."], [685, 695, "Vos en Haas", "k", "Kitty gaat op vakantie. Fox droomt er ook van om ergens heen te gaan en organiseert daarom vakanties voor zichzelf en de Bunny, en betrekt tegelijkertijd Kie?ka en Gutek bij zijn vakantieplannen."], [695, 705, "Yetili vertelt", "k", "Nina en Leon zijn op een geheime missie: ze spelen spionnetje en hopen uit te vinden waar Yetili zijn lekkernijen heeft verstopt."], [705, 715, "Casper en Emma", "k", "Tijdens het ontbijt komt er plotseling een walm uit het broodrooster. Snel grijpt Emma's moeder in en voorkomt brand. Later, op school, vertelt een brandweercommandant tijdens een oefening aan alle leerlingen wat ze moeten doen in een noodsituatie."], [715, 720, "Samson en Marie", "k", "Marie wil Samson beetnemen. Ze doet alsof Samson onzichtbaar geworden is. Samson gelooft het eerst niet, maar omdat Marie zo volhoudt, begint hij er langzaamaan toch wel in te geloven."], [720, 735, "Mush Mush en de Zwammetjes", "k", "Mush-Mush, Lilit en Sep ontdekken een superplakkerig sapje en hebben er veel plezier mee."], [735, 750, "Wannabe's", "k", "Said wil een datingapp lanceren, maar hij wil die eerst testen met zijn vrienden van Video King. Iedereen maakt een profiel aan en dan blijkt dat Trix plots een match heeft met Mike."], [750, 765, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [765, 790, "Mega Mindy", "k", "Iemand probeert een beroemde diamant, die in de kluis van het politiebureau ligt, te stelen. De commissaris, die er zeker van was dat de diamant daar veilig zou zijn, is zeer verbaasd als er toch ingebroken wordt."], [790, 800, "Mega Maffe Monsterfreaks", "k", "Tijdens een spelletje tijdslijm-paintball met Arthur ontdekt Bo een vreemd en schattig wezen onder haar bed. Er wordt een ontsnappingsplan bedacht."], [800, 825, "100% Wolf: De legende van de maansteen", "k", "Freddy en de kinderen vervalsen een weerwolfwaarneming om de ouders van Scarlet ertoe te zetten niet uit het dorp te vertrekken."], [825, 835, "Coop Troep", "k", "Reggie belt de troep omdat hij wil leren dansen met Agnes en Agnes belt de troep omdat ze een foto van zichzelf wil voor Reggie. Terwijl Clive Reggie les geeft, neemt Flo Agnes mee op een gekke fotoshoot."], [835, 840, "Kleine dingen", "k", "Oranje vindt een schatkaart en volgt de instructies om Blauw, Groen, Roze en Geel te vinden."], [840, 845, "Tik Tak", "k", "Een blokpuzzel van een lynx, voedselmoza?ek van een raket en het Boekenmeisje speelt met een slee."], [845, 850, "Bumba", "k", "Terwijl Bumba saxofoon speelt, bespeelt Bumbina haar trommel van achter een toverstok."], [850, 855, "Timbalo", "k", "Ontdek wat Pepe en Zaza doen in de tuin voor ze samen eten en tel samen tot drie. Toto bezorgt boodschappen bij Mimi en welke auto is van wie?"], [855, 860, "Uki", "k", "Uki en Konijn spelen op een berg met sneeuw. Ze proberen te slee?n, maar vallen steeds. Gelukkig kan Eekhoorn hen leren hoe ze veilig kunnen slee?n."], [860, 865, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [865, 870, "Meneer Papier", "k", "Meneer Papier schildert zichzelf. Als hij zijn zelfportret uitknipt zijn er twee Meneren Papier. Ze lijken wel erg op elkaar. Ze lopen op dezelfde manier, hebben tegelijk zin in een boterham en willen op hetzelfde moment rusten."], [870, 875, "Kaatjes Kameraadjes", "k", "Frits, Frats en Kaatje weten niet veel over padden. Kameraadjes Charles en Rocky weten alles over deze dieren. Ze helpen met hun opa om padden veilig de weg te laten oversteken."], [875, 880, "Charlie", "k", "In een hechte familie staat iedereen altijd klaar om elkaar te helpen, vooral op moeilijke momenten. En het is ook leuk om grapjes uit te halen. Je moet goed op de details letten, want een \"1 aprilgrap\" ligt altijd op de loer - vooral in april!"], [880, 885, "Pol de Piratenmuis", "k", "Robin wil eerste stuurman zijn en dit geeft Pol een idee. Waarom wisselen alle piraten niet van rol? Iedereen vindt het een geweldig plan en ze nemen hun posities in. Al spoedig loopt het uit de hand."], [885, 894, "Yetili vertelt", "k", "Henri heeft zijn vrienden uitgenodigd voor het diner in de grote zaal van het kasteel. Het voorgerecht is pompoensoep, maar terwijl de gasten die eten worden ze oranje. Bij het eten van de salade worden ze groen, en bij het ijs worden ze doorzichtig."], [894, 900, "Rintje", "k", "Het is dierendag. Rintje, Tobias en Henriette mogen iets lekkers kopen. Maar ze zijn niet de enigen: bij de winkel van Poedel Sinkel staat een lange rij. Het wachten is saai en iedereen wordt ongeduldig. Dan bedenkt Rintje een grappig spelletje."], [900, 905, "Lena's Boerderij", "k", "Deze kip hoort eieren te leggen, net als de andere kippen. Maar de zwaluwen in de lucht hebben een heel ander verlangen in haar wakker gemaakt: ze wil vliegen."], [905, 915, "Sam & Julia", "k", "Ella speelt met Sam en Julia en zij wil bepalen hoe een spel gespeeld moet worden. Maar haar twee vrienden vinden het logisch dat iedereen luistert naar degene die er het meest vanaf weet."], [915, 920, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [920, 930, "Kabam!", "k", "June houdt enorm van tekenen, maar rekenen vindt ze heel erg lastig. Als ze sommen moet maken in de klas, raakt ze in paniek. Tot ??n van haar tekeningen haar te hulp schiet."], [930, 935, "Lu en de dolle boel minis", "k", "Biba raakt gefrustreerd als Lu hun kussenkasteel verlaat om met baby Bo te spelen."], [935, 945, "Aap, Poot, Pies", "k", "Appie is trots op zijn nieuwe onderbroek en wil die aan iedereen laten zien. Hij is dan ook beduusd als een omaatje zegt dat hij zich moet schamen dat hij zijn onderbroek aan iedereen wil laten zien."], [945, 955, "Saïd & Anna", "k", "Sa?d en Anna willen naar het strand en natuurlijk moeten Zonia en Sameer ook mee. Het is alleen erg druk in de werkplaats, dus moeten Sa?d en Anna het strand maar naar de werkplaats halen."], [955, 960, "Samson en Marie", "k", "Samson heeft een ei. Hij wil aan Bobientje laten zien dat hij daar goed voor kan zorgen. Maar als Samson niet in de buurt is, breekt Marie het eitje per ongeluk. Ze vervangt het ei door een ander, in de hoop dat Samson niets merkt."], [960, 965, "De avonturen van kleine pinguïn", "k", "Omdat Leah afstamt van prinses Yuen, stuurt Joe haar en Oscar op een zoektocht."], [965, 975, "Interstellar Ella", "k", "Animatiereeks over de avonturen van het zevenjarige meisje Ella en haar vrienden in het universum."], [975, 985, "Le village enchanté de Pinocchio", "k", "Pinokkio woont in een betoverd dorp, dat bewoond wordt door sprookjesfiguren en hun kinderen. Hij beleeft hier spannende avonturen, samen met zijn vrienden. Hij is nogal goedgelovig en komt vaak in de problemen."], [985, 995, "De Marsupilami's", "k", "Mica verstopt per ongeluk zijn Marsupilamiboek in het fysicahandboek van Acu. Hij wil dit verborgen houden voor Jade, maar ze ontdekt het toch."], [995, 1005, "De Chimera Wachters", "k", "Thelma heeft een verschrikkelijke nachtmerrie waar Wendy in een kloof in het ijs valt. Thelma doet er alles aan om haar zus voor het minste gevaar te behoeden."], [1005, 1015, "Shaun het schaap", "k", "De schapen hebben de verjaardagstaart opgegeten die Bitzer voor de boer had gebakken. Nu moet Shaun in het geheim een nieuwe taart bakken, met een verrassing voor zowel de boer als Bitzer als gevolg."], [1015, 1035, "Draken: beschermers van Berk", "k", "Schorrie gaat undercover om samen met de groep een Skrill te redden van de Barbaren."], [1035, 1040, "Coop Troep", "k", "Maggie is ziek. En nu belt Sam met de mededeling dat de puppy's aan de tv verslingerd zijn geraakt. Cornelius biedt zich aan als verpleger. Alleen gaat Maggie in een onbewaakt moment aan de wandel."], [1040, 1075, "Nachtwacht: Het Kristal van het Kwaad", "k", "De Nachtwacht wordt door de president van de Hoge Raad, Xantara, beschuldigd van een zware misstap, waarna ze hun krachten verliezen. Al snel ontdekken ze Xantara's ware intenties: met het Kristal van het Kwaad wil ze de mensenwereld vernietigen."], [1075, 1085, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1085, 1090, "Noodle and Bun", "k", "Bun zit vast en Noodle bedenkt allerlei manieren om hem los te krijgen."], [1090, 1105, "No Yap!", "k", "Ze ontmoeten kinderen die al heel wat 'grotemensenwerk' doen. Dat geeft hen een gevoel van verantwoordelijkheid en trots."], [1105, 1110, "Waiko: reis door de ruimte", "k", "Exoplaneten zijn planeten ver buiten ons zonnestelsel. Elke dag gaan wetenschappers op zoek naar nieuwe, knotsgekke planeten in de ruimte. Otto droomt ervan om ook ??n te vinden, maar dat is niet zo makkelijk..."], [1110, 1125, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [1125, 1145, "Lettersoep", "k", "Emma en Bram, een broer-zus-duo dat bulkt van de moppen en humor, nemen het op tegen Cesar en Casper, twee taalwonderen met een neus voor kennis en vreemde talen."], [1145, 1150, "Grizzy & the Lemmings", "k", "De Lemmingen maken grapjes bij de zandsculpturen van Grizzly. Woedend jaagt hij ze ver weg en maakt van hun afwezigheid gebruik om de meest grandioze sculptuur van zichzelf te maken."], [1150, 1160, "De regels van Floor", "k", "Michael krijgt alle aandacht van de meisjes, waaronder Ilona, vanwege zijn mooie scooter. Kees is jaloers, dus wanneer Ilona een rit nodig heeft, liegt Kees dat hij een dure scooter heeft."], [1160, 1185, "Spellbound", "k", "Cece wil kost wat kost een perfecte lift uitvoeren en heeft daarvoor Benoit nodig. Maar zodra ze aan het werk gaan, loopt alles rondom hen compleet in het honderd."], [1185, 1195, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1195, 1200, "Zo Cool!", "k", "Wist je dat er goud zit in het menselijk lichaam? Is het waar dat we sterker worden van spinazie te eten? Dit zijn het soort vragen die simpel lijken, maar waar we het antwoord niet op kennen."], [1200, 1240, "Sporza: UEFA Champions League Vrouwen", "k", "Verslag van de wedstrijd OH Leuven - HB K?ge, gespeeld in de competitiefase van de UEFA Women's Champions League."], [1240, 1285, "VRT NWS journaal met VGT", "n", "Nieuws en sport, getolkt in Vlaamse Gebarentaal (VGT)."], [1285, 1325, "VRT NWS Pano met VGT", "d", "Duidingsmagazine met indringende reportages over de grote thema's van deze tijd. Een gedreven team van reporters diept de beste nieuwsverhalen uit en zoekt het antwoord op actuele vragen. Getolkt in Vlaamse Gebarentaal (VGT)."]], "vtm": [[355, 360, "Kabouter Plop", "k", "Klus en Lui moeten afwassen, maar zoals altijd valt de postbode in slaap. Klus vindt dat niet leuk en hij zet alle potten en pannen in de regen. Zo zal alles proper worden. Als hij na de regenbui de afwas wil halen, is de huisraad verdwenen."], [360, 365, "Kabouter Plop", "k", "Plop moet flink wat rommel naar de kaboutervuilnisbelt brengen. Klus raadt zijn vriendje aan om eerst te sporten zodat hij fit en sterk wordt. Dan zal het zware werk veel gemakkelijker gaan."], [365, 375, "Bol & Smik", "k", "Het is niet simpel voor Bol en Smik om te wippen op een wipplank. Ze verschillen te veel in grootte."], [375, 390, "Bol & Smik", "k", "Het verhaal van twee dikke vrienden die samen gekke avonturen beleven. Ze wonen samen in een gezellig huisje waarin ze al hun vriendjes ontvangen."], [390, 400, "De avonturen van Lolly Lolbroek", "k", "Lolly en Kara organiseren een knutselwedstrijd voor Hubert, Marx en Lex. Hubert heeft er een rommeltje van gemaakt en moet opruimen, maar daar heeft hij geen zin in. Hij krijgt verdwijnsnoepjes van Lex om de rommel te laten verdwijnen."], [400, 410, "Maya de Bij", "k", "Maya raakt bevriend met zweefvlieg Syrphie, een vlieg die eruitziet als een wesp. Als de wespen bijzondere pollen willen stelen, helpt Syrphie Maya de honing terug te krijgen door zich voor te doen als wesp tussen Stinger en zijn aanhangers."], [410, 425, "Maya de Bij", "k", "Willy en Maya gaan op zoek naar iets te eten voor vier baby-vuurvliegjes die honger hebben. Maar het probleem wordt steeds groter, omdat er steeds nieuwe baby-vuurvliegjes bij komen."], [425, 440, "Sinterklaaskapoentjes", "k", "Marie bereidt met haar hulpchefs een heuse pizzaparty voor met pizzamijters voor de komst van Sinterklaas, Pakjespiet pakt ondertussen met de kinderen de laatste cadeautjes in en James vraagt zich af of Sinterklaas ook soms eens stout is."], [440, 465, "Hallo K3", "k", "Als Karen de weddenschap aangaat om achtenveertig uren zonder gsm te leven, ontdekken Kristel en Josje al gauw dat ze vals speelt. De twee besluiten Karen beet te nemen, door haar berichtjes te sturen in Bas' naam."], [465, 490, "Echte Verhalen: De Buurtpolitie", "k", "Tineke is ziek, dus gaat Aziz vandaag op pad met Koen. Wanneer ze horen dat het slachtoffer van een vechtpartij een affaire heeft met een getrouwde man, verdenken ze al snel de bedrogen echtgenote."], [490, 515, "VLOGLAB Secrets #Stories", "k", "Deze jeugdserie volgt de vloggers van de Vloglabband. Liefde, vriendschap, maar vooral veel drama lijkt hen steeds te achtervolgen. Gelukkig hebben ze elkaar en een vriendschapsband waar niemand tussen kan komen."], [515, 535, "LEGO Friends: The Next Chapter", "k", "Leo wil geen nee tegen zijn vrienden zeggen en is op drie plaatsen tegelijk nodig tijdens de geldinzameling voor het nieuwe buurthuis. Hierdoor komt de culinaire tovenaar onder grote druk te staan."], [535, 555, "Arthur en de Minimoys", "k", "Door een foutje in de oogdruppels van Miro groeit hij weer tot zijn ware grootte. Kan Arthur snel genoeg een tegengif vinden om te voorkomen dat Miro het dorp vertrappelt?"], [555, 570, "Maya de Bij", "k", "Flip zat vroeger in een populair muziekgroepje samen met zijn neven. Maya besluit om hen te herenigen, maar dat verloopt niet zonder slag of stoot."], [570, 590, "Open keuken met Sandra Bekkari", "l", "Voedingscoach Sandra Bekkari deelt vandaag een recept voor vol-au-vent, oftewel pasteitjes. Verder bakt ze ovenfrietjes en bereidt ze marsepeinballetjes."], [710, 740, "Familie", "f", "Het nieuws over de arrestatie verspreidt zich als een lopend vuurtje en speculaties steken de kop op. V?ronique is er zeker van dat Simon het brein is achter alles. Erik springt haar te hulp."], [740, 780, "Florentina", "f", "De charmante, maar onzekere Flo werkt in het wellness- en fitnessimperium van haar moeder, waar een slanke lijn heilig is. Zelf voldoet ze echter niet aan dat klassieke schoonheidsbeeld."], [780, 810, n Jarrod. Ivy en Mary sluiten een verrassend verbond terwijl Ren? uit zijn dak gaat."], [1175, 1235, "See No Evil", "o", "In Calgary, Alberta, ontvangt de 24-jarige Ryan Lane een telefoontje in de nacht en gaat op weg om de mysterieuze beller te ontmoeten. Daarna ontbreekt elk spoor. De Calgary Police Service wendt zich tot videobeelden om Ryan te traceren."], [1235, 1365, "1917", "o", "Tijdens de Eerste Wereldoorlog krijgen twee Britse soldaten een ogenschijnlijk onmogelijke opdracht. In een race tegen de klok moeten ze vijandelijk gebied binnendringen om een boodschap af te leveren die mogelijk zestienhonderd soldaten kan redden."], [1365, 1410, "Twisted Metal", "o", "Calypso verrast de deelnemers met een wending die het spel volledig op z'n kop zet. Sweet Tooth wordt uit het spel gehaald; John en Quiet worden geconfronteerd met hun gevoelens."], [1410, 1450, "Twisted Metal", "o", "John en Quiet staan voor een onverwachte uitdaging; Calypso houdt een onderzoek."], [1450, 1510, "Hawaii Five-0", "o", "Een man die ervan beschuldigd wordt zijn vrouw om het leven te hebben gebracht, dreigt zelfmoord te plegen. Grover, die een ervaringsdeskundige is, moet in actie komen om hem tegen te houden."]], "play7": [[100, 160, "A Place in the Sun", "o", "Jacky en Roland Attridge uit Oxford hebben 280.000 pond te besteden aan een woning nabij de Atlantische stranden in La Rochelle, de uiterst stijlvolle vakantiebestemming voor Parijzenaars."], [435, 475, "Love It or List It", "o", "Realityshow over families die ontevreden zijn over hun huis. De designer probeert hen te overtuigen om het huis op te knappen, terwijl de makelaar vindt dat ze moeten zoeken naar een andere woning."], [475, 530, "Property Brothers", "o", "Lege nesters Karen en Rick hebben hun huis de eerste dag op de markt verkocht en willen een luxe toevluchtsoord vinden waar ze tijd kunnen doorbrengen met hun vier kleinzonen."], [530, 560, "Ware Delicatessen", "o", "Chef Bart Desmidt gaat aan de slag met ingredi?nten hops voor lichaam en geest."], [1235, 1310, "Blind Gekocht NL", "l", "Alisha en Noud komen er samen, maar niet uit: de een wil Eindhoven, de ander Tilburg. De twee lovebirds willen niets liever dan een nieuwe plek voor hen samen, alleen waar gaan ze wonen?"], [1310, 1365, "Komen Eten", "o", "Vier gasten, vier avonden, culinaire hoogstandjes en een flinke portie sfeer en gezelligheid."], [1365, 1425, "Huizenjagers", "l", "Saskia en haar zes Chihuahua's zouden hun appartementje graag willen inruilen voor een nieuw pand waar ze iets meer buitenruimte hebben."], [1425, 1490, "Love It or List It", "o", "Na twee jaar zoeken naar hun droomhuis, hebben Jamie en Greg het eindelijk gevonden. Ze zijn hun huis echter alweer ontgroeid en zijn ondertussen meer op zoek naar functionaliteit."], [1490, 1550, "Next Level Chef", "o", "Aan het einde van de audities strijden de professionele koks om een van de begeerde vijf plekken."]]}}]};
const CATS = {n:"Nieuws & weer",f:"Serie",m:"Film",e:"Entertainment",q:"Quiz & spel",d:"Docu & info",k:"Kinderen",l:"Koken & wonen",x:"Radio & beelden",s:"Sport",o:"Overig"};
const CH = DATA.channels, chById = Object.fromEntries(CH.map(c => [c.id,c]));
const ALL = [];
DATA.days.forEach((day,di) => CH.forEach(c => (day.progs[c.id]||[]).forEach(r =>
  ALL.push({id:`${day.date}-${c.id}-${r[0]}`, di, ch:c.id, start:r[0], end:r[1], title:r[2], cat:r[3], desc:r[4]||""}))));
const byId = Object.fromEntries(ALL.map(p => [p.id,p]));
const progsOf = (di,ch) => ALL.filter(p => p.di === di && p.ch === ch);

const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function brussels(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Brussels",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x => [x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, min:+p.hour*60 + +p.minute};
}
function nowFor(di){
  const b = brussels(), day = DATA.days[di]; if (!day) return null;
  if (b.date === day.date) return b.min;
  const nx = new Date(day.date+"T12:00:00Z"); nx.setUTCDate(nx.getUTCDate()+1);
  if (b.date === nx.toISOString().slice(0,10) && b.min < 180) return b.min + 1440;
  return null;
}
let di = Math.max(0, DATA.days.findIndex(d => d.date === brussels().date));

  $("#gen").textContent = `Gegevens van TVvisie.be, ververst op ${DATA.generated}. Uitzenduren kunnen last minute wijzigen.`;

function renderBoard(){
  const t = atMin;
  $("#at").value = Math.min(Math.max(t,300),1530); $("#atout").textContent = fmt(t);
  $("#btn-now").disabled = nowMin === null;
  $("#btn-now").setAttribute("aria-pressed", nowMin !== null && t === nowMin);
  $("#btn-prime").setAttribute("aria-pressed", t === 1230);
  document.querySelectorAll("[data-next]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.next === nextN));
  $("#board").innerHTML = visibleCh().map(c => {
    const ps = progsOf(di,c.id), p = ps.find(x => x.start <= t && t < x.end);
    const ups = ps.filter(x => x.start > t), shown = ups.slice(0, nextN);
    const head = `<div class="ch"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</div>`;
    const next = shown.length ? `<ul class="upnext">${shown.map(n => `<li class="${n.start >= 1200 && n.start < 1380 ? "prime" : ""}" style="--cat:${catVar(n.cat)}"><b>${fmt(n.start)}</b><button data-p="${n.id}">${esc(n.title)}</button><span class="cat" title="${CATS[n.cat]||CATS.o}"></span></li>`).join("")}${
      ups.length > shown.length ? `<li style="display:block"><span class="more">+ nog ${ups.length - shown.length} tot ${fmt(ups[ups.length-1].start)}</span></li>` : ""}</ul>` : "";
    if (!p) return `<article class="slot off">${head}<p class="title">${ps.length ? "Geen uitzending" : "Geen gegevens"}</p>${next}</article>`;
    const pct = Math.round((t-p.start)/(p.end-p.start)*100);
    return `<article class="slot">${head}<button class="title" data-p="${p.id}">${esc(p.title)}</button>

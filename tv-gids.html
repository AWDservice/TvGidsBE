main{padding:18px 0 40px}section[hidden]{display:none}

.tl{position:relative;overflow:auto;max-height:calc(100vh - 210px);min-height:320px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overscroll-behavior:contain}
.tl-inner{position:relative}
.ruler{position:sticky;top:0;z-index:5;height:34px;border-bottom:1px solid var(--line);background:var(--surface)}
.ruler .corner{position:sticky;left:0;z-index:6;width:96px;height:100%;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--muted)}
.ruler span{position:absolute;top:9px;font-size:12px;font-weight:600;color:var(--muted);transform:translateX(5px);font-variant-numeric:tabular-nums}
.ruler span.hour{color:var(--ink);font-weight:800;font-size:13px}
.ruler span::before{content:"";position:absolute;left:-5px;top:-9px;height:34px;border-left:1px solid var(--line)}
.row{position:relative;height:var(--rowh,78px);border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row:nth-child(odd){background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.chcol{position:sticky;left:0;z-index:4;width:96px;height:100%;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;font-weight:700;font-size:13px;line-height:1.15}

.prog.live{background:color-mix(in srgb,var(--now) 22%,var(--surface));border-color:var(--now)}
.prog.past{opacity:.5}
.prog.tiny b{-webkit-line-clamp:1}.prog.tiny span{display:none}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:3;pointer-events:none}
.nowline::before{content:attr(data-t);position:absolute;top:6px;left:-20px;background:var(--now);color:var(--now-ink);font-size:11px;font-weight:800;padding:1px 5px;border-radius:4px}

.chn{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;padding-top:2px}

589, "Stoppeltje", "k", "Stoppeltje brandt een paar haren in een vijandige wereld, waar bommen ontploffen."], [589, 595, "Rintje", "k", "Juf Wijskop is bijna jarig. Alle hondjes mogen een optreden verzinnen. Rintje en Tobias willen gaan rappen, maar daar vindt Henriette niets aan. Zij wil een toneelstuk doen."], [595, 599, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [599, 614, "Pop Papierstad", "k", "De vriendjes helpen Helpende Hand met het nieuwe menu van het Grote Pleincaf? en Hooper maakt samen met Vlieg een puddingtaart. Maar hij is bang dat de taart niet speciaal genoeg is."], [614, 620, "Knofje", "k", "Knofje is een eigenzinnig meisje van vierenhalf. Ze woont met haar moeder, vader en babyzusje Elisabeth in een flat waar ze van alles beleeft. Knofje onderzoekt dingen die normaal lijken te zijn voor ons, maar die buitengewoon zijn voor haar."], [620, 624, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [624, 635, "Beer Bo", "k", "Beer Bo onderzoekt waarom een klein konijntje wel kan bewegen, maar niet kan lopen."], [635, 645, "Ridder Muis", "k", "Het is feest, want Draak is jarig. Ridder Muis treft alle voorbereidingen voor een knalfeest, maar de feestelijkheden lopen niet helemaal zoals verwacht."], [645, 655, "Edmond & Lucy", "k", "Edmond, Lucy en Mitzi zien vreemde voetafdrukken in de sneeuw en ontdekken dat Edward verdwenen is."], [655, 665, "Vos en Haas", "k", "Bernard vindt een gigantische dobbelsteen in een wegwerpdoos. Boubou, die er ook zijn zinnen op heeft gezet, besluit het te ruilen voor zijn favoriete Houhou-pop. Boubou realiseert zich dat hij een grote fout heeft gemaakt."], [665, 669, "Kaatjes Kameraadjes", "k", "Viktor wil kamperen met Kaatje, maar dat ziet Kaatje niet zitten. Wanneer kameraadje Mona laat zien hoe leuk het is om in een tentje te slapen, gaat Kaatje toch overstag."], [669, 679, "Toet Toet Cory Carson", "k", "De vraag is of Cory er klaar voor is om zonder bumpers te bowlen. Wanneer de familie Carson de baan opgaat, besluit Cory te gaan bowlen zoals de grote kinderen."], [679, 685, "Slaapwel", "k", "De nacht eindigt terwijl de lichte regen ophoudt. Een kleine grijze slak verlaat zijn blad en zakt weg onder een dode tak die op de grond ligt. Hier blijft hij voordat hij zijn huisje binnengaat en zachtjes de deur sluit."], [685, 689, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [689, 695, "Mironins", "k", "Low leert kalligrafie aan zijn vrienden, maar Ro en Blu houden zich niet aan de oorspronkelijke vorm van de letters. Wat Low niet weet, is dat er verschillende vormen van kalligrafie bestaan."], [695, 705, "Yetili vertelt", "k", "Nina wil het verhaal van Roodkapje, maar Leon vraagt om eentje over brandweerlieden. Dus vertelt Yeti het verhaal over kleine Pierre die bij de brandweer werkt. Op een avond staat een hele wijk in brand en moet Pierre zijn oma en haar goudvis redden."], [705, 715, "Casper en Emma", "k", "Emma houdt veel van haar grote hond Bassa. Bassa is niet alleen een goede vriend, maar ook een goede wachthond. Vandaag speelt Casper bij Emma en in de tuin gooien ze Bassa een bal toe. Bassa springt over het hek en loopt weg."], [715, 720, "Samson en Marie", "k", "Marie wil goochelen. Samson vindt dat best spannend. Hij moet in een doos gaan zitten en dan zal Marie een grote verdwijntruc uitvoeren. Maar wanneer Marie de doos weer opent, is Samson tot haar verbazing echt weg...!"], [720, 730, "Mush Mush en de Zwammetjes", "k", "Nu Sumush in het bos is, verklaren Mush-Mush en Fonge dat zij de sterkste zwammetjes zijn."], [730, 735, "Zig & Sharko", "k", "Het is Halloween en Marina is dolblij, maar Sharko is bang voor zombies. Dus stelen Zig en Bernie een drankje dat de kleppers in zombies kan veranderen. Zo kunnen ze de haai bang maken en hebben ze vrij spel om de zeemeermin op te eten."], [735, 750, "Wannabe's", "k", "Fitnesslerares Daisy gaat met Video King instructiefilmpjes maken voor haar fitnesskanaal. Mike heeft meteen een hippe sportoutfit gekocht, en ook al is hij totaal niet sportief, hij gaat er volledig voor."], [750, 765, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [765, 790, "Mega Mindy", "k", "Rob, een bankberover, is pas vrijgelaten uit de gevangenis, en wil wraak nemen op de commissaris, omdat hij hem gearresteerd heeft. Hij bedenkt een sluwe list om de commissaris om de tuin te leiden. Gelukkig heeft Mega Mindy het door."], [790, 800, "Mega Maffe Monsterfreaks", "k", "Een gigantische, energievretende vogel zuigt de energiecentrales van Griezelbeek leeg. De Van Altens gaan de lucht in om dit prachtige, maar gevaarlijke wezen aan te vallen."], [800, 825, "100% Wolf: De legende van de maansteen", "k", "Het jaarlijkse maansteen-evenement staat voor de deur, en de studenten strijden in verschillende spelvormen om de winst, en een kans om de maansteen aan te raken."], [825, 835, "Coop Troep", "k", "Als Prince belt en klaagt over de kou, installeert Flo een van haar uitvindingen om de boel op te warmen, maar het werkt te goed. De troep zit vast op de boerderij en het is een race om Fred en Frida te redden van een tekort aan water."], [835, 840, "Kleine dingen", "k", "Wanneer de Hele Kleine Wezentjes fruit ontdekken, leren ze dat iedereen een andere smaak heeft."], [840, 845, "Tik Tak", "k", "Ontdek een voedselmoza?ek van een blokhut, een brutale kameleon speelt met een kleurrijke spin en het Boekenmeisje maakt een drone."], [845, 850, "Bumba", "k", "Vlaamse animatiereeks over de avonturen van circusclown Bumba en zijn vriendjes Bumbina, Bumbalu, Kiwi de vogel, Nanadu de berin en Tumbi de olifant. Samen verkennen ze op een grappige en educatieve manier de wereld waarin ze leven."], [850, 855, "Timbalo", "k", "Toto verkleedt zich terwijl Mimi aan het rad draait. Samen gaan ze naar de bistro van Pepe en ondertussen zoekt Zaza de juiste afbeeldingen en de drie verschillen bij het huis."], [855, 860, "Uki", "k", "Eekhoorn is nootjes aan het verzamelen en Uki kijkt hoe hij dat doet. Plots valt er een nootje op Uki's hoofd. Om zich ertegen te beschermen, haalt hij een paraplu. Dan ontdekken ze dat een paraplu erg handig kan zijn om veel nootjes te verzamelen."], [860, 865, "Sarah knutselt", "k", "Sarah knutselt samen met haar vriendjes de leukste knutselwerkjes."], [865, 870, "Meneer Papier", "k", "Meneer Papier geniet van het zonnetje. Dan drijven grauwe wolken voor de zon en steekt een wind op. Bomen en struiken gaan heen en weer in de wind. Meneer Papier en Poes moeten zich vasthouden om zelf niet weg te waaien. Ze raken met moeite thuis."], [870, 875, "Kaatjes Kameraadjes", "k", "Frits en Frats zijn ervan overtuigd dat de maan van kaas is. Wanneer Kaatje dit tegenspreekt, geloven ze haar niet. Tot kameraadje Sander hen aantoont dat de maan niet van kaas, maar van steen is."], [875, 880, "Charlie", "k", "Charlie droomt van een perfect pyjamafeestje met Monica, maar door alle voorbereidingen, twijfels op het laatste moment en het gehaaste heen-en-weergeloop van het ene huis naar het andere, raakt hij steeds vermoeider."], [880, 885, "Pol de Piratenmuis", "k", "De vrienden merken dat Lou iets verbergt, een schat! En het is niet zomaar een schat, het is een replica van de Bamboem, gemaakt van zand. De piraten bedenken allerlei manieren om de schat veilig te houden."], [885, 894, "Yetili vertelt", "k", "Yeti vertelt over een jongetje dat maar niet naar bed wil. De jongen wil graag blijven spelen. Hij moet oppassen dat hij niet gaat gapen, want dan sturen zijn ouders hem naar bed. Hij wordt langzaam aan toch moe."], [894, 900, "Rintje", "k", "Oma heeft een muts voor Rintje gebreid. Rintje wil hem niet op, maar het moet van mama. Op weg naar school verstopt hij de muts in de bosjes. Die haalt hij straks wel weer op. Maar na school is de muts weg! Wat moet hij nu thuis vertellen?"], [900, 905, "Lena's Boerderij", "k", "De rups wil dolgraag dansen met de insecten, maar die lachen hem uit om zijn onhandigheid. Alleen de kleinste is in hem ge?nteresseerd. Dan gebeurt er iets onverwachts."], [905, 915, "Sam & Julia", "k", "Opa Zeeman vertelt over een slee tijdens zijn poolexpeditie, maar het verhaal lijkt meer op een legende. Dokter Pokken gelooft hem dus niet. Sam en Julia besluiten om de slee te bouwen om dokter Pokken te laten zien dat het verhaal echt waar is."], [915, 920, "Sarah zingt", "k", "Sarah zingt samen met haar vriendjes de leukste kinderliedjes, en iedereen doet mee."], [920, 930, "Kabam!", "k", "Elli wil heel graag al haar goocheltrucs laten zien, maar er zitten wel heel veel ouders en kinderen in de zaal. Kon ze maar iets bedenken waardoor het publiek niet meer zo eng voelt..."], [930, 935, "Lu en de dolle boel minis", "k", "Elodie vindt een speelgoedwagen op de plank. Declan en Lu willen er echter ook mee spelen."], [935, 945, "Aap, Poot, Pies", "k", "Appie kijkt in het broedhuisje naar een kuikentje dat uit een ei komt. Het liefst zou hij hier de hele dag willen blijven maar Luc heeft meer te doen. Appie besluit zelf een nestje te bouwen en een eitje uit te broeden."], [945, 955, "Saïd & Anna", "k", "Sa?d en Anna zijn aan het voetballen. Bodi zegt dat basketballen leuker is. Wanneer Sa?d en Anna met Bodi willen basketballen, wil hij niet meedoen. Lukt het hun om Bodi zo ver te krijgen?"], [955, 960, "Samson en Marie", "k", "Van Leemhuizen vraagt aan Samson en Marie om voor hem een vaas op te halen bij het postkantoor. Marie laat de vaas vallen en deze valt in scherven uiteen. Dit is een ramp. Marie doet haar best om de stukken te lijmen en weer tot een vaas te puzzelen."], [960, 965, "De avonturen van kleine pinguïn", "k", "De tempel van de Feniks wordt aangevallen en slechts ??n pingu?n kan het heilige zwaard vrijlaten."], [965, 975, "Interstellar Ella", "k", "Animatiereeks over de avonturen van het zevenjarige meisje Ella en haar vrienden in het universum."], [975, 985, "Het betoverde dorp van Pinokkio", "k", "Victor probeert indruk te maken op prinses Betilda en geeft haar de hoorn van een eenhoorn, ondanks de waarschuwing van Bettina. Als de prinses langzaam in een eenhoorn verandert, moeten Pinokkio en zijn vrienden haar redden."], [985, 995, "De Marsupilami's", "k", "Rosa wordt verplicht om beveiligingscamera's te installeren in het park. Het zijn er veel, en de mensen houden er niet van bekeken te worden. Bovendien zitten de Marsu's vast en geraken ze niet langs de camera's."], [995, 1005, "De Chimera Wachters", "k", "Wendy stoort zich aan haar bril en Lunar geeft haar een scherper zicht. Maar Wendy misbruikt de kracht en de reusachtige Chimera wordt bijziend."], [1005, 1015, "Shaun het schaap", "k", "Op een avond nestelt de boer zich voor de tv met een bak kipkluifjes. Intussen vult de slaperige Shaun zijn kussen per ongeluk met een levende kip in plaats van met kippenveren. Het kippenspook slaat op hol en jaagt de boer de stuipen op het lijf."], [1015, 1035, "Draken: beschermers van Berk", "k", "De bende kijkt wie beter een Verschrikkelijke Verschrikking traint. Alvin komt dichter bij Berk."], [1035, 1040, "Beroepen", "k", "Om beter te begrijpen waaruit bepaalde beroepen bestaan, leggen schoolkinderen met hun woorden de beroepen van hun ouders uit."], [1040, 1075, "Nachtwacht: Het Kristal van het Kwaad", "k", "De Nachtwacht wordt door de president van de Hoge Raad, Xantara, beschuldigd van een zware misstap, waarna ze hun krachten verliezen. Al snel ontdekken ze Xantara's ware intenties: met het Kristal van het Kwaad wil ze de mensenwereld vernietigen."], [1075, 1085, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1085, 1110, "GameKeepers", "k", "Mats en Sari moeten dansen voor hun leven. In een hippe buurt moeten ze verschillende dance levels overwinnen om zo de highscore proberen te verbreken. Maar kwaadaardige avatars in urban streetkledij doen er alles aan om hen te stoppen."], [1110, 1125, "Hallo Kroket", "k", "Dagelijkse liveshow waarin de KETNET-wrappers je meetrekken in de wereld van KETNET en die van de Ketnetters. Verwacht je aan bekende gasten, zotte primeurs, leuke optredens, spannende spelletjes en nog zo veel meer. HALLO KROKET!"], [1125, 1145, "Lettersoep", "k", "Retage en Josefien uit Antwerpen, een duo van muziek en boeken, nemen het op tegen Viktor en Mirko, een verrassende mix van debatteren en muziek maken."], [1145, 1150, "Grizzy & the Lemmings", "k", "Grizzy wordt wakker na een dutje en is uitgehongerd. Dan blijkt de laatste pot Yummy chocoladepasta leeg te zijn en Grizzy komt op het idee om chocoladepoeder te mengen met kokosmelk. De Lemmings, die net zo gulzig zijn, willen hun deel van de drank."], [1150, 1160, "De regels van Floor", "k", "Jan hoort van Jaap dat hij een oude intacte legodoos voor een flink geldbedrag verkoopt. Daarom gaat Jan naar zijn ouders om te zoeken naar zijn oude legokasteel. Maar dan blijkt dat hij die destijds samen met zijn broer cadeau heeft gekregen."], [1160, 1185, "Spellbound", "k", "Cece en Jade moeten samenwerken voor een dansopdracht en komen zo dichter bij elkaar. Amy en Lola onderzoeken enkele Mystic-kwesties."], [1185, 1195, "Karrewiet", "n", "Infomagazine voor de jeugd."], [1195, 1200, "Zo Cool!", "k", "Wist je dat er goud zit in het menselijk lichaam? Is het waar dat we sterker worden van spinazie te eten? Dit zijn het soort vragen die simpel lijken, maar waar we het antwoord niet op kennen."], [1215, 1260, "VRT NWS journaal met VGT", "n", "Nieuws en sport, getolkt in Vlaamse Gebarentaal (VGT)."]], "vtm": [[345, 350, "Kabouter Plop", "k", "Klus is dol op de pap van Plop en hij kan niet aan de verleiding weerstaan om te proeven. Hij wacht wel tot Plop de keuken verlaat. Maar die keert sneller dan voorzien terug. Klus schrikt en zijn bril valt in de pap."], [350, 355, "Kabouter Plop", "k", "Plop heeft te veel kleren voor de wasdraad. Klus zal helpen door het ene eind van de wasdraad omhoog te houden. Al snel krijgt hij pijn in zijn arm en hij vraagt Kwebbel of ze hem eventjes wil aflossen."], [355, 365, "Bol & Smik", "k", "Smik is jaloers op de dinosaurusknuffel van Bol en gaat op zoek naar een eigen slaapknuffel."], [365, 375, "Bol & Smik", "k", "Smik besluit om Bol te helpen met het uitkiezen van de mooiste tomaat."], [375, 390, "De avonturen van Lolly Lolbroek", "k", "Marx is met de fiets van Kara op een boom gereden. Het voorwiel is geplooid, een grote ramp. Lex stuurt Marx een superfloepspil. Zo wordt hij ijzersterk en kan hij het wiel weer maken. Hij is echter veel sterker dan hij denkt en breekt de fiets."], [390, 400, "Maya de Bij", "k", "De wespen hebben een nieuw geheim wapen: een vreemd zaad dat iedereen gek maakt. Dankzij dat zaad kunnen ze de koningin ontvoeren en vragen ze losgeld. Maya, Willy en Flip gaan op reddingsmissie."], [400, 410, "Maya de Bij", "k", "De mieren verloren een kostbaar flesje koninginnengelei en Maya en Willy gaan hiernaar op zoek in een van de mestballen van Ben."], [410, 430, "Sinterklaaskapoentjes", "k", "Piet maakt poetsen leuk met zijn zelfgemaakt stokpoetspaardje, Marie maakt met haar kleine hulpchefs bladerdeegstafjes met extra veel kaas en James vraagt zich af of de Sint nog meer huisdieren heeft naast zijn paard."], [430, 455, "Hallo K3", "k", "Kristel is het beu dat Karen geen rekening houdt met het huishouden en beslist daarom een poetsplanning op te stellen. Ondertussen organiseert Rosie een nachtmarathon voor het goede doel en doet Josje zich voor als een plantenfluisteraar."], [455, 480, "Echte Verhalen: De Buurtpolitie", "k", "De laatste tijd worden bij verschillende horecazaken bakken met leeggoed gestolen. Om de dief te kunnen pakken, krijgen Koen en Tineke een speciaal gadget van de commissaris."], [480, 505, "VLOGLAB Secrets #Stories", "k", "Deze jeugdserie volgt de vloggers van de Vloglabband. Liefde, vriendschap, maar vooral veel drama lijkt hen steeds te achtervolgen. Gelukkig hebben ze elkaar en een vriendschapsband waar niemand tussen kan komen."], [505, 525, "LEGO Friends: The Next Chapter", "k", "Autumn gaat paardrijden met Aliya, maar zou eigenlijk in het hondenopvangcentrum moeten zijn, waar Nova en Liann per ongeluk chaos veroorzaken."], [525, 545, "Arthur en de Minimoys", "k", "Koning Sifrat, zijn familie en Arthur worden door Malthazard uitgenodigd om zijn verjaardag te vieren. Alles lijkt goed te gaan totdat zij het feest willen verlaten en Malthazard een Chilop op hen afstuurt."], [545, 560, "Maya de Bij", "k", "Bijenwas verplicht iedereen steeds harder te werken. Daarom gaan de werkbijen in staking. Maya probeert een oplossing te bedenken, maar dat blijkt alles alleen maar erger te maken."], [560, 575, "Open keuken met Sandra Bekkari", "l", "Voedingscoach Sandra Bekkari deelt haar recept voor parelhoen met een korst van noten, spruitjes en pompoenpuree. Als bijgerecht snijdt ze carpaccio van gepofte rode biet."], [695, 730, "Familie", "f", "Vlaamse soap over het wel en wee van de familie Van den Bossche en hun entourage."], [730, 780, "Expeditie Pairi Daiza", "d", "Het leven in het park staat nooit stil. Louise wil met zoveel mogelijk dieren kennismaken en daarom stelt Christophe haar voor aan de manenwolven. Om dit seizoen af te sluiten neemt Louise Steffi Mercie mee naar het opvangcentrum voor wilde dieren."], [780, 810, "VTM Nieuws", "n", "Nieuws van de dag met achtergrondinformatie, gevolgd door uitgebreide sportverslaggeving."], [810, 820, "Het Weer (middag)", "n", "Blik op het weer in Vlaanderen en daarbuiten."], [820, 850, "Familie", "f", "Gaston is ziek, dus Hanne blijft thuis. Dit is een grote opluchting voor Quinten. Sam gaat op bezoek bij Niko en waagt een laatste poging om hem op andere gedachten te brengen. C?dric heeft een voorstel voor Zjef."], [850, 915, "Wittekerke", "f", "Stef vertelt Tanja en Katrien dat hij naar Antwerpen vertrekt. Chris heeft de banden met aannemer Buytaert verbroken en zit nu helemaal aan de grond."], [915, 970, "Gooische Vrouwen", "f", "De vriendschap van Willemijn en Anouk staat op scherp als Anouk onthult dat Evert verliefd op haar is. Willemijn probeert met behulp van een medium wraak te nemen. Claire gaat op zoek naar een rijke nieuwe echtgenoot."], [970, 1005, "Lisa", "f", "Onderweg naar de dokter, kussen Jonas en Lisa elkaar, maar ze zien niet dat er een drone in de lucht hangt. Doordat Mikhel zijn enkel verzwikt heeft en Katja ziek is, besluiten ze om naar huis te gaan."], [1005, 1100, "De Verraders", "e", "De finale is aangebroken. Het is tijd voor de munt van de waarheid en de laatste verdenkingen aan de ronde tafel. Wie speelt het slimst en gaat uiteindelijk met de overwinning aan de haal?"], [1100, 1140, "Florentina", "f", "Florentina ontdekt wie de opdrachtgever is van de witwaspraktijk. Sami is bezorgd over zijn vader ?n Florentina. Willem wil Manon dringend spreken, maar die ontwijkt hem. Wes en Manon spreken af."], [1140, 1195, "VTM Nieuws", "n", "Nieuws van de dag met achtergrondinformatie, gevolgd door uitgebreide sportverslaggeving."], [1195, 1205, "Het Weer", "n", "Blik op het weer in Vlaanderen en daarbuiten."], [1205, 1240, "Familie", "f", "Stefanie kan Simon overtuigen om zijn verhaal te doen. Josefien vangt Wesley op in de brouwerij. Hij neemt haar in vertrouwen en doet zijn verhaal. Hanne heeft haar trip naar Zweden moeten afzeggen door het werk."], [1240, 1305, "Camping Coppens", "e", "Neefje Marcel arriveert op Camp Grinsby, tot grote vreugde van Beau. Nora leert autorijden en zet zo een stap richting zelfstandigheid. Iedereen bereidt zich voor op een storm, terwijl Monique onverwacht wordt gebeld door de Zweedse schaatsfederatie."], [1305, 1375, "Gevangenisdirecteurs", "d", "Directeur Jolien d'Hondt heeft in Gent enkele tuchtgesprekken. In Antwerpen en Sint-Gillis helpen directeurs An en Jo waar nodig tijdens een stakingsdag, terwijl kinderen van de lokale lagere school een bezoek brengen aan de gevangenis in Merksplas."], [1375, 1435, "Telefacts", "n", "Brengt buitenlandse reportages met een bijzondere blik op de wereld tot in de Vlaamse huiskamers."]], "vtm2": [[710, 770, "MasterChef Australië", "e", "Chef Guillaume Brahimi heeft voor de drukproef een gerecht meegebracht dat de deelnemers tot het uiterste drijft. Ze moeten het gerecht zo nauwkeurig mogelijk namaken en vijf stuks ervan serveren."], [770, 830, "Kitchen Nightmares", "e", "Gordon schiet de traditionele Ierse pub Finn McCool's te hulp. Hij brengt grootse veranderingen aan die het leven voor de eigenaars voorgoed zullen veranderen."], [830, 890, "24 Hours in A&E", "d", "Danny is door een dakraam gevallen. Clara heeft een kikkererwt in haar neus. Tara heeft buikpijn."], [890, 960, "MasterChef Australië", "e", "De emoties lopen hoog op als de vijf koks kisten openen en daarbij foto's van hun eigen kookhelden onthullen. Ge?nspireerd door de foto's van hun moeders en grootmoeders, vechten ze voor de laatste kans op immuniteit."], [960, 1015, "Achter gesloten deuren", "e", "Lefa is na de dood van haar moeder teruggekomen om hier van haar kind te bevallen. Ze is liefdevol opgevangen door haar nieuwe vriend. Maar de vraag is wie de vader is."], [1015, 1075, "Kitchen Nightmares", "e", "Gordon Ramsay gaat naar eetcaf?, The Olde Stone Mill in New York. Het is gerenoveerd, maar de service en het eten zijn nog steeds waardeloos."], [1075, 1155, "B&B zoekt Lief NL: Winter", "e", "Berggids Klaas zoekt hoog in de Oostenrijkse Alpen voorzichtig zijn weg in de liefde. Verderop in Oostenrijk rolt er een nieuwe liefdesgast Claudia's erf op, wat voor de nodige beweging zorgt in haar liefdeszoektocht."], [1155, 1185, "Home and Away", "f", "Harper brengt Archie met tegenzin naar Tane en Jo vertrekt zodra ze hen samen ziet. Mali praat intussen met John over het heropenen van de fitness."], [1185, 1235, "Mr. Frank Visser Doet Uitspraak", "e", "John en Geraldine zijn eigenaar van een volkstuintje waar ze in alle rust de bloemetjes buiten kunnen zetten. Tot hun grote teleurstelling is er echter al van begin af aan gedonder met de buren."], [1235, 1295, "Murder in a Small Town", "f", "De politiemacht van Gibsons moet snel handelen na een dubbele ontvoering. Ze ontdekken al snel dat de criminelen een veel groter plan hebben."], [1295, 1350, "Murder in a Small Town", "f", "Karl wordt opgeroepen naar Seattle, waar hij herenigd wordt met de gestoorde seriemoordenaar Tommy Cummins. Cassandra krijgt te maken met conflicten binnen de raad en een onverwacht bezoek van haar moeder."], [1350, 1390, "Citadel", "f", "Kyle en Bernard reizen naar New York City om de Citadel X Case te stelen van Manticore Headquarters voordat het te laat is. Later ontdekt Kyle dat een figuur uit zijn verleden nog leeft en hij zet alles op het spel om ze te vinden."], [1390, 1450, "The Equalizer", "f", "McCall haast zich om een bezorgde vrouw te helpen haar man te vinden voordat hij een extremistische groep helpt bij het uitvoeren van een bomaanslag in de stad. McCall maakt zich zorgen dat haar anonimiteit in het gedrang komt."]], "vtm3": [[35, 90, "Chicago P.D.", "o", "Na een brutale schietpartij komen Burgess en Ruzek vast te zitten op de metro. Terwijl ze bewijsmateriaal proberen te verzamelen, raakt de rest van het team betrokken bij een tragisch familiedrama."], [360, 540, "Qmusic", "o", "Geniet van de allerleukste muziek met Qmusic. Livebeelden vanuit de radiostudio, Twitter- en Instagram-updates, videoclips, weerberichten en nog veel meer."], [880, 905, "Ghosts", "o", "Als er een vrouw opduikt die beweert de erfgenaam van Woodstone Mansion te zijn, roepen Sam en Jay de hulp in van een advocaat; Isaac probeert te beslissen hoe hij de helft van Sams voorschot aan zijn autobiografie gaat besteden."], [905, 995, "Mr. Bean's Holiday", "o", "Mr. Bean besluit op vakantie te gaan en reist naar de Franse Rivi?ra. Na een aantal misverstanden gaat alles - zoals verwacht - mis en wordt hij aangezien voor een kidnapper."], [995, 1045, "Chicago P.D.", "o", "Een gezin wordt thuis vergiftigd en het team ontdekt een link naar de Becks. Ruzek gaat undercover en als hij dichter bij Samantha komt, ontdekt hij gruwelijke informatie over haar vader Richard."], [1045, 1100, "Chicago P.D.", "o", "Voight treedt als getuige op in een moordzaak tegen drugsbaron Arturo Morales. Zodra blijkt dat Morales een jurylid heeft be?nvloed, doet Voight er alles aan om het recht te laten zegevieren."], [1100, 1125, "How I Met Your Mother", "o", "Als The Captain aan Lily vraagt of ze een jaar naar Rome wil om zijn kunstadviseur te worden, is ze bang dat Marshall boos zal worden. Ted en Barney raken geobsedeerd door een meisje dat haar prachtige lichaam verbergt in een dikke jas."], [1125, 1155, "Ghosts", "o", "Sam, Jay en de overgebleven geesten ontrafelen het mysterie van welke geest naar het hiernamaals is gegaan. Sam en Jay moeten een uil zien te verplaatsen om Jay's restaurant in een schuur te kunnen beginnen."], [1155, 1185, "The Simpsons", "o", "Homer leert basgitaar spelen om zijn midlifecrisis te bestrijden. Met andere vaders richt hij een coverband op, maar het bescheiden succes van de band valt in het niet bij Apu's populariteit."], [1185, 1215, "The Big Bang Theory", "o", "Sheldon en Amy zoeken hun heil in wiskunde om de bruiloft stress te doen verzachten. Ondertussen verbreekt Raj de vriendschap met Howard omdat hij het gevoel heeft dat de relatie zijn zelfvertrouwen aantast."], [1215, 1240, "The Big Bang Theory", "o", "Sheldon maakt plannen voor een diner ter ere van Amy's verjaardag. Verder ontvangt Leonard een kerstkaart van zijn broer."], [1240, 1360, "Gemini Man", "o", "Henry Brogan is een huurmoordenaar die het doelwit wordt van een agent die schijnbaar al zijn bewegingen kan voorspellen. Tot zijn schrik komt hij er al snel achter dat de man die hem probeert te vermoorden een jongere versie van hemzelf is."], [1360, 1480, "The Grey", "f", "Na een vliegtuigcrash in Alaska, moeten de overlevers vechten voor hun leven in de wildernis, maar een roedel wolven maakt hen dit zo moeilijk mogelijk."], [1480, 1540, "The Big Bang Theory", "o", "Sheldon en Amy zoeken hun heil in wiskunde om de bruiloft stress te doen verzachten. Ondertussen verbreekt Raj de vriendschap met Howard omdat hij het gevoel heeft dat de relatie zijn zelfvertrouwen aantast."]], "vtm4": [[95, 140, "60 Days In", "o", "Carlos ontdekt waarom hij voortijdig uit het programma werd verwijderd en Darius worstelt om de vrede te bewaren. De rust bij de vrouwen wordt verstoord en drie overgebleven deelnemers ontmoeten de sheriff om hem te vertellen wat ze hebben ontdekt."], [420, 600, "Willy", "o", "De Willy-dj's zorgen voor de beste platen met de nodige rock-'n-roll."], [860, 915, "Police Interceptors", "o", "James 'Coups' Coupland zet de achtervolging in wanneer een Fiesta hem aan hoge snelheid voorbijrijdt. Phil Broughton doet een verrassende vaststelling wanneer hij een voertuig aan de kant laat zetten."], [915, 965, "Police Interceptors", "o", "Paul en Lewis maken jacht op drie tieners die een winkeleigenaar bedreigd zouden hebben met een geweer. In Stapleford worden Jen en haar hond Quantum opgeroepen voor een inbraak."], [965, 1020, "Xena: Warrior Princess", "o", "Gabrielle, Xena, Joxer en Aphrodite gebruiken verhalen om een weggelopen prinses te helpen beseffen hoe belangrijk thuis is."], [1020, 1075, "MacGyver", "o", "MacGyver neemt het op tegen een briljante afperser die een bom op een schip heeft geplaatst."], [1075, 1125, "Police Interceptors", "o", "Spenner en nieuweling Phoebe achtervolgen een automobilist die het gaspedaal stevig ingedrukt houdt en de agenten probeert af te schepen."], [1125, 1180, "Police Interceptors", "o", "Een krachtige motor scheurt zich een weg door het landelijke Nottinghamshire."], [1180, 1235, "Police Interceptors", "o", "Een team achtervolgt de bestuurder van een wit busje die zich duidelijk niets aantrekt van snelheidslimieten. Wanneer de man het op een lopen zet, zet politiehond Quantum de achtervolging in."], [1235, 1355, "Double Jeopardy", "o", "Libby wordt schuldig bevonden aan de schijnbare moord op haar man Nick. Wanneer ze na zes jaar gevangenis voorwaardelijk vrijkomt, komt ze erachter dat haar man nog leeft."], [1355, 1405, "Street Cops", "o", "Twee agenten spreken een man aan met een American Bully XL zonder muilkorf, maar hij vlucht weg. Will en Carl jagen intussen op een bende die een kwetsbare man uitbuit."], [1405, 1465, "Police Interceptors: Pursuit and Capture", "o", "Een vluchtende crimineel probeert enkele achtervolgende agenten te slim af te zijn door frontaal op hen af te rijden, waardoor hun voertuig aan hoge snelheid in de railing van een brug belandt."]], "play4": [[60, 115, "Zondag Matchdag", "s", "In Zondag Matchdag zet presentator Carl Dircksens zich als dertiende man tussen de lijnen en de supporters en praat hij de belangrijkste hoogtepunten van de speeldag in Jupiler Pro League aan elkaar."], [360, 540, "Nostalgie: Sta Op! met Véronique De Kock", "x", "V?ronique De Kock sleurt je samen met Sander Vandenhende door de ochtendrush en zorgt ervoor dat je helemaal klaar bent voor de start van je werkdag."], [685, 715, "That '70s Show", "f", "Jaloezie tussen broers! Eric is blij als Hyde zijn klusjes doet, maar dat verandert wanneer zijn ouders Hyde meer gaan waarderen dan hem. Is Hyde de nieuwe favoriete zoon van Red en Kitty?"], [715, 740, "That '70s Show", "f", "De Formans houden een garage sale om wat extra geld te verdienen. Hyde heeft echter niets te verkopen, dus bakt hij 'speciale brownies' om te verkopen. Fez geeft Jackie een indrukwekkende kus."], [740, 785, "Daan & Jani", "e", "Daan Alferink en Jani Kazaltzis verzamelen meningen die al te vaak worden ingeslikt. Iedereen zit vol 'onpopular opinions' die zelden hardop gezegd worden, maar schreeuwen om besprok 5": [[90, 140, "Doc", "f", "Een mysterieus, snelwerkend en extreem dodelijk virus veroorzaakt een noodafsluiting op de 6e verdieping van het Westside Hospital. In een poging om de crashende Richard te redden van een dodelijk virus, raakt Amy ermee besmet."], [140, 185, "Doc", "f", "Een mysterieus, snelwerkend en uiterst dodelijk virus leidt tot een noodafsluiting van de zesde verdieping van het Westside-ziekenhuis. In een poging de stervende Richard te redden van het dodelijke virus, raakt Amy er zelf mee besmet."], [375, 420, "Grey's Anatomy", "f", "Maggie heeft haar laatste werkdag in het ziekenhuis en bespreekt haar toekomst met Winston. Amelia's relatie met Kai wordt op de proef gesteld. Ben maakt zich zorgen naarmate Baileys kwaadwillende online activiteiten toenemen."], [420, 460, "SkyMed", "f", "Door personeelstekorten worden de Sky Med verpleegkundigen gedwongen de Thompson Eerste Hulp van de ene op de andere dag te bemannen. Een instabiele en onberekenbare pati?nt zorgt voor chaos in het ziekenhuis."], [460, 505, "SkyMed", "f", "Een leuk avondje uit in de stad heeft onverwachte gevolgen. Een gevaarlijk telefoontje met een verlamde pati?nt dwingt Stef ertoe om eindelijk het geheim te onthullen dat haar bij Thompson bracht."], [535, 585, "Castle", "f", "Castle en Beckett duiken in de wereld van de haute couture als een modeverslaggever wordt vermoord. Becketts verleden als model komt onverwachts van pas tijdens het onderzoek."], [585, 630, "Castle", "f", "Castle en Beckett onderzoeken de dood van een schoolmeisje en zijn verbijsterd wanneer het spoor naar een dader met telekinetische krachten leidt."], [630, 685, "Elsbeth", "f", "Een rokkenjagende directeur wordt vermoord na een opera. Elsbeth vermoedt dat een geobsedeerde operafan de misdaad heeft gepleegd vanwege een rinkelende telefoon tijdens de voorstelling. Het team krijgt te maken met veranderingen in het district."], [685, 735, "Elsbeth", "f", "Een miljardair komt om het leven bij een ongeluk tijdens een ruimtetrainingssimulatie. Elsbeth vermoedt dat een wraakzuchtige collega verantwoordelijk is. Elsbeth wordt herenigd met een oud-collega uit Chicago."], [735, 785, "NCIS", "f", "Gibbs en McGee reizen naar Moskou om een computerexpert veilig naar huis te begeleiden. De helikopter wordt op 20 kilometer van de Finse grens uit de lucht geschoten."], [785, 835, "Fire Country", "f", "Een ex-gedetineerde brandweerman, die wrok koestert tegen Sharon, keert terug om wraak te nemen."], [835, 965, "The Man in the Iron Mask", "f", "Frankrijk, 1660. Wanneer Lodewijk XIV in Athos' zoon Raoul een rivaal ziet, beramen Athos, Porthos en Aramis een plan om de zonnekoning te vervangen door zijn tweelingbroer, die al zes jaar gevangen zit."], [965, 1015, "Castle", "f", "Een vrouw geteisterd door schuldgevoel bekend een moord, maar tegenstrijdig bewijs maakt de zaak ietwat ingewikkelder. Het blijft trouwens ook niet bij deze ene bekentenis."], [1015, 1070, "Castle", "f", "Beckett wordt gevraagd om te assisteren bij een onderzoek naar drugshandel. Maar wanneer een eenvoudige undercoveroperatie verkeerd gaat staat ze plotseling oog in oog met de New Yorkse onderwereld."], [1070, 1120, "Elsbeth", "f", "Voormalig kindster Mac wordt op Halloween wakker met geheugenverlies en vermoedt dat ze een moord heeft gepleegd. Elsbeths team helpt haar de waarheid te achterhalen. Wagner heeft te maken met een laag moreel in het district."], [1120, 1180, "Elsbeth", "f", "Elsbeth en het team onderzoeken de dood van een medewerker van de meest exclusieve juwelierszaak van New York. Ze ontdekken dat er plannen zijn voor een overval op een gala."], [1180, 1235, "NCIS: Hawaii", "f", "Terwijl Jane de ontvoering van Maggie onderzoekt, is ze geschokt wanneer ze de waarheid ontdekt. Vervolgens schakelt ze haar team en Whistler in om haar bevindingen te bewijzen."], [1235, 1380, "Good Will Hunting", "f", "Will Hunting heeft een heel hoog IQ, maar heeft door zijn moeilijke jeugd geen opleiding gevolgd. Als hij
